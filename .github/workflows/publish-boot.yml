name: Publish built boot.img as release

# 把已有 build run 的 artifact 直接发布成 GitHub Release，
# 免去重新编译，也方便手机直接下载（不需要登录 Actions 页面）。

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Build run ID (例如 42054473850)'
        required: true
        type: string
      artifact_name:
        description: 'Artifact 名称（留空则自动用 hummer-boot-<run_id>）'
        required: false
        type: string

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Download artifact from the build run
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_name || format('hummer-boot-{0}', inputs.run_id) }}
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: artifact

      - name: Create / update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          set -eux
          ls -lh artifact
          tag="boot-${RUN_ID}"
          notes=$(cat artifact/build-info.txt 2>/dev/null || true)
          if gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" artifact/bootwork/new-boot.img artifact/bootwork/stock-boot.img \
              -R "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" \
              artifact/bootwork/new-boot.img \
              artifact/bootwork/stock-boot.img \
              -R "$GITHUB_REPOSITORY" \
              --title "hummer boot image ($RUN_ID)" \
              --notes "$notes"$'\n\nnew-boot.img sha256: '"$(sha256sum artifact/bootwork/new-boot.img | cut -d' ' -f1)"
          fi
          gh release view "$tag" -R "$GITHUB_REPOSITORY" --json url -q .url
