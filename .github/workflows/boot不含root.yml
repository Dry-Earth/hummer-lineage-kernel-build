name: LineageOS 24 Kernel for hummer (6.6.x) [Extract Config Minimal Patch]

env:
  TZ: Asia/Shanghai
  ANDROID_VERSION: 'android17'
  KERNEL_VERSION: '6.6'
  SUB_VERSION: 'latest' 
  CCACHE_KEY: ccache-lineageos24-6.6-extract
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 5G
  OFFICIAL_BOOT_URL: "https://mirrorbits.lineageos.org/full/hummer/20261030/boot.img"

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    outputs:
      bootimg_name: ${{ steps.create_bootimg.outputs.bootimg_name }}
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: 下载 LineageOS 24 官方 boot.img
        run: |
          curl -f -L -C - --retry 3 --retry-delay 5 -o stock_boot.img "${{ env.OFFICIAL_BOOT_URL }}"
          ls -la stock_boot.img

      - name: 安装环境依赖 & 初始化源码与工具链
        run: |
          sudo apt update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libncurses-dev libncurses5-dev dwarves \
            libssl-dev libelf-dev aria2 unzip zip git wget ccache patch \
            gcc-aarch64-linux-gnu jq lz4 zstd

          rm -rf kernel_workspace
          mkdir kernel_workspace
          cd kernel_workspace
          cp ../stock_boot.img .

          echo "正在克隆 LineageOS 24 官方 SM8750 内核源码..."
          git clone --depth=1 --branch lineage-24.0 https://github.com/LineageOS/android_kernel_oneplus_sm8750.git common

          echo "正在初始化子模块..."
          cd common
          git submodule update --init --recursive --depth=1
          
          # ===== 【全自动极限防守排雷大法】 =====
          echo "========================================="
          echo "正在执行极限防守排雷 (遇到同名文件先备份，再删引用)..."
          echo "========================================="
          
          # 1. 极限防守清理 Makefile 缺失引用
          find drivers -name "Makefile" | while read -r mfile; do
            dir_prefix=$(dirname "$mfile")
            # 提取 += 后面的完整路径（支持多级）
            grep -oP '(?<=\+= )[\w\-/]+' "$mfile" | sort -u | while read -r path; do
              clean_path="${path%/}"
              [ -z "$clean_path" ] && continue
              
              # 如果它不是一个合法的目录
              if [ ! -d "$dir_prefix/$clean_path" ]; then
                # 如果存在同名文件，先改名备份，防止误删有用的配置
                if [ -f "$dir_prefix/$clean_path" ]; then
                  echo "  -> [极限防守] 发现同名文件占用，改名备份: $dir_prefix/$clean_path -> ${clean_path}.bak"
                  mv "$dir_prefix/$clean_path" "$dir_prefix/${clean_path}.bak"
                fi
                
                echo "  -> [Makefile] 移除缺失的目录引用: $dir_prefix/$clean_path"
                sed -i "\|+=.*${clean_path}\([[:space:]]\|$\)|d" "$mfile"
              fi
            done
          done

          # 2. 清理 Kconfig 缺失引用
          find drivers -name "Kconfig" | while read -r kfile; do
            dir_prefix=$(dirname "$kfile")
            grep -oP '(?<=source ").*(?=")' "$kfile" | while read -r path; do
              if [[ "$path" == drivers/* ]] || [[ "$path" == /* ]]; then
                full_path="$path"
              else
                full_path="$dir_prefix/$path"
              fi
              if [ ! -f "$full_path" ] && [ ! -d "$full_path" ]; then
                echo "  -> [Kconfig] 移除缺失引用: $path"
                escaped_path=$(echo "$path" | sed 's/[]\/$*.^[]/\\&/g')
                sed -i "/source \"$escaped_path\"/d" "$kfile"
              fi
            done
          done
          
          echo "✅ 极限排雷完毕！"
          cd ..

          echo "正在下载 LLVM/Clang..."
          mkdir -p clang18
          curl -f -L -C - --retry 3 --retry-delay 5 --retry-connrefused \
            -o clang-r547379.tar.gz \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android16-qpr2-release/clang-r547379.tar.gz
          tar -xzf clang-r547379.tar.gz -C clang18
          rm -f clang-r547379.tar.gz

          echo "正在下载构建工具..."
          aria2c -s16 -x16 -k1M https://github.com/cctv18/oneplus_sm8650_toolchain/releases/download/LLVM-Clang18-r510928/build-tools.zip -o build-tools.zip
          unzip -q build-tools.zip
          rm -rf build-tools.zip

          echo "[微创] 去除 dirty 后缀..."
          for f in common/scripts/setlocalversion; do
            sed -i 's/ -dirty//g' "$f"
            sed -i '$i res=$(echo "$res" | sed '\''s/-dirty//g'\'')' "$f"
          done

      - name: 配置 ccache
        run: |
          echo "CCACHE_REAL_KEY=${CCACHE_KEY}-extract" >> "$GITHUB_ENV"
          mkdir -p "${{ env.CCACHE_DIR }}"
          ccache -M "${{ env.CCACHE_MAXSIZE }}"
          ccache -o compression=true

      - name: 载入 ccache 缓存
        uses: actions/cache@v4
        id: ccache-restore
        with:
          path: ${{ env.CCACHE_DIR }}
          key: >-
            ${{ env.CCACHE_REAL_KEY }}-${{ runner.os }}-${{ github.ref_name }}
          restore-keys: |
            ${{ env.CCACHE_REAL_KEY }}-${{ runner.os }}-

      - name: 准备 magiskboot
        run: |
          cd kernel_workspace
          # 依然使用备用二进制源，因为 Magisk 官方 APK 的结构变动会导致解压失败
          wget -q https://github.com/1xyz/magiskboot_binary/raw/main/magiskboot
          if [ ! -f magiskboot ]; then
            echo "::error::magiskboot 下载失败！"
            exit 1
          fi
          chmod +x magiskboot
          echo "✅ magiskboot 就绪"

      - name: 应用 Droidspaces kABI 补丁 (网络下载版)
        run: |
          cd kernel_workspace/common
          echo "正在从 cctv18 备份仓库下载 kABI 补丁..."
          
          # 使用极其稳定的备份源
          PATCH_URL="https://raw.githubusercontent.com/cctv18/oppo_oplus_realme_sm8750/main/droidspaces_patch/fix_sysvipc_kabi_6_7_8.patch"
          
          if ! curl -fsSL -o fix_sysvipc_kabi.patch "$PATCH_URL"; then
            echo "::error::补丁下载失败，可能是网络问题！"
            exit 1
          fi
          
          echo "✅ 补丁下载成功，大小: $(wc -c < fix_sysvipc_kabi.patch) bytes"
          
          if patch -p1 -F 3 --dry-run < fix_sysvipc_kabi.patch > /dev/null 2>&1; then
            patch -p1 -F 3 < fix_sysvipc_kabi.patch
            echo "✅ kABI 补丁干净应用"
          else
            echo "::warning::尝试 fuzz 应用..."
            patch -p1 -F 3 < fix_sysvipc_kabi.patch || true
          fi
          rm -f fix_sysvipc_kabi.patch

      - name: 提取原厂配置并注入容器支持
        run: |
          export PATH="/usr/lib/ccache:$PATH"
          export PATH="$(pwd)/kernel_workspace/clang18/bin:$PATH"
          export PATH="$(pwd)/kernel_workspace/build-tools/bin:$PATH"
          cd kernel_workspace

          echo "正在解包官方 boot.img..."
          mkdir -p unpack_dir
          cd unpack_dir
          ../magiskboot unpack ../stock_boot.img
          cd ..

          if [ ! -f unpack_dir/kernel ]; then
            echo "::error::解包失败，缺少 kernel 文件"
            exit 1
          fi

          echo "正在提取 .config..."
          cd common
          mkdir -p out
          ./scripts/extract-ikconfig ../unpack_dir/kernel > out/.config 2>/dev/null || true
          cd ..

          if [ $(wc -l < common/out/.config) -gt 1000 ]; then
            echo "✅ 成功提取原厂配置！"
          else
            echo "::error::提取失败！"
            exit 1
          fi

          echo "正在注入容器配置..."
          ./common/scripts/config --file ./common/out/.config \
            --enable PID_NS --enable IPC_NS --enable USER_NS --enable SYSVIPC \
            --enable DEVTMPFS --enable NAMESPACES --enable POSIX_MQUEUE \
            --enable MULTIUSER --enable IKCONFIG --enable IKCONFIG_PROC \
            --enable NETFILTER_XT_MATCH_ADDRTYPE --enable NETFILTER_XT_TARGET_LOG \
            --enable NETFILTER_XT_MATCH_RECENT

          echo "执行 olddefconfig..."
          cd common
          make -j$(nproc --all) LLVM=1 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            CC="ccache clang" LD="ld.lld" HOSTLD=ld.lld O=out olddefconfig
          cd ..

          echo "执行断言检查..."
          ASSERT_PASS=true
          for CONFIG in CONFIG_PID_NS CONFIG_IPC_NS CONFIG_USER_NS CONFIG_SYSVIPC CONFIG_DEVTMPFS CONFIG_NAMESPACES CONFIG_POSIX_MQUEUE CONFIG_NETFILTER_XT_MATCH_ADDRTYPE; do
            if grep -q "^${CONFIG}=y" common/out/.config; then
              echo "  [✓] $CONFIG"
            else
              echo "  [✗] $CONFIG 未开启！"
              ASSERT_PASS=false
            fi
          done

          if [ "$ASSERT_PASS" = false ]; then
            echo "::error::断言失败！"
            exit 1
          fi
          echo "✅ 断言通过！"

      - name: 编译内核
        run: |
          export PATH="/usr/lib/ccache:$PATH"
          export PATH="$(pwd)/kernel_workspace/clang18/bin:$PATH"
          export PATH="$(pwd)/kernel_workspace/build-tools/bin:$PATH"
          cd kernel_workspace/common

          make -j$(nproc --all) LLVM=1 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            CC="ccache clang" LD="ld.lld" HOSTLD=ld.lld O=out \
            KCFLAGS+=-O2 KCFLAGS+=-Wno-error Image

          echo "✅ 内核编译完成！"

      - name: 生成 boot.img
        id: create_bootimg
        run: |
          cd kernel_workspace
          cp common/out/arch/arm64/boot/Image unpack_dir/kernel
          cd unpack_dir
          ../magiskboot repack ../stock_boot.img ../new-boot.img
          cd ..
          
          BOOTIMG_NAME="droidspaces-lineageos24-boot.img"
          mv new-boot.img "${BOOTIMG_NAME}"
          echo "bootimg_name=${BOOTIMG_NAME}" >> $GITHUB_OUTPUT
          echo "✅ 生成完毕！"

      - name: 保存 ccache 缓存
        if: steps.ccache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: >-
            ${{ env.CCACHE_REAL_KEY }}-${{ runner.os }}-${{ github.ref_name }}

      - name: 上传 boot.img
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.create_bootimg.outputs.bootimg_name }}
          path: kernel_workspace/${{ steps.create_bootimg.outputs.bootimg_name }}
          if-no-files-found: error
