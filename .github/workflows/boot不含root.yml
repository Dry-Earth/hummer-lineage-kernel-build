name: LineageOS 23.2 Kernel for hummer (6.6.144) [Extract Config Minimal Patch]

env:
  TZ: Asia/Shanghai
  KERNEL_VERSION: '6.6'
  SUB_VERSION: '144'
  CCACHE_KEY: ccache-lineageos23.2-6.6.144-extract
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 5G
  OFFICIAL_BOOT_URL: "https://mirrorbits.lineageos.org/full/hummer/20261009/boot.img"

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    outputs:
      bootimg_name: ${{ steps.create_bootimg.outputs.bootimg_name }}
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: 下载 LineageOS 官方 boot.img
        run: |
          curl -f -L -C - --retry 3 --retry-delay 5 -o stock_boot.img "${{ env.OFFICIAL_BOOT_URL }}"
          ls -la stock_boot.img

      - name: 安装环境依赖 & 初始化源码与工具链
        run: |
          sudo apt update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libncurses-dev libncurses5-dev dwarves \
            libssl-dev libelf-dev aria2 unzip zip git wget ccache patch \
            gcc-aarch64-linux-gnu jq lz4 zstd

          rm -rf kernel_workspace
          mkdir kernel_workspace
          cd kernel_workspace

          cp ../stock_boot.img .

          echo "正在克隆 LineageOS 官方 SM8750 内核源码..."
          git clone --depth=1 --branch lineage-23.2 https://github.com/LineageOS/android_kernel_oneplus_sm8750.git common

          echo "正在初始化子模块..."
          cd common
          git submodule update --init --recursive --depth=1
          
          # 【全自动排雷 2.0】全局扫描并清理缺失的闭源驱动引用
          echo "========================================="
          echo "正在全自动清理缺失的闭源驱动引用..."
          echo "========================================="
          
          # 1. 清理所有 Kconfig 中的无效 source
          find . -name "Kconfig" | while read -r kconfig_file; do
            grep -oP '(?<=source ").*(?=")' "$kconfig_file" 2>/dev/null | while read -r path; do
              # 忽略包含变量的路径 (如 source "arch/$ARCH/Kconfig")
              if [[ "$path" == *"$"* ]]; then continue; fi
              
              if [ ! -f "$path" ] && [ ! -d "$path" ]; then
                echo "  -> [$kconfig_file] 发现缺失路径: $path，正在自动移除..."
                # 转义特殊字符以供 sed 使用
                escaped_path=$(echo "$path" | sed 's/[]\/$*.^[]/\\&/g')
                sed -i "/source \"$escaped_path\"/d" "$kconfig_file"
              fi
            done
          done

          # 2. 清理所有 Makefile 中的无效 obj-y/obj-m
          find . -name "Makefile" | while read -r makefile; do
            grep -oP '(?<=obj-[ym] \+= )[\w\-]+(?=/)' "$makefile" 2>/dev/null | sort -u | while read -r dir; do
              makefile_dir=$(dirname "$makefile")
              if [ ! -d "$makefile_dir/$dir" ]; then
                echo "  -> [$makefile] 发现缺失目录: $dir，正在从 Makefile 移除..."
                sed -i "/obj-[ym] += $dir\//d" "$makefile"
              fi
            done
          done
          echo "✅ 全自动排雷完成！"
          cd ..

          echo "正在下载 LineageOS 官方 LLVM/Clang (r547379)..."
          mkdir -p clang18
          curl -f -L -C - --retry 3 --retry-delay 5 --retry-connrefused \
            -o clang-r547379.tar.gz \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android16-qpr2-release/clang-r547379.tar.gz
          tar -xzf clang-r547379.tar.gz -C clang18
          rm -f clang-r547379.tar.gz

          echo "正在下载构建工具..."
          aria2c -s16 -x16 -k1M https://github.com/cctv18/oneplus_sm8650_toolchain/releases/download/LLVM-Clang18-r510928/build-tools.zip -o build-tools.zip
          unzip -q build-tools.zip
          rm -rf build-tools.zip

          echo "[微创] 仅去除 dirty 后缀..."
          for f in common/scripts/setlocalversion; do
            sed -i 's/ -dirty//g' "$f"
            sed -i '$i res=$(echo "$res" | sed '\''s/-dirty//g'\'')' "$f"
          done

      - name: 计算 ccache 真实 Key
        run: |
          echo "CCACHE_REAL_KEY=${CCACHE_KEY}-extract" >> "$GITHUB_ENV"

      - name: 载入 ccache 缓存
        uses: actions/cache@v4
        id: ccache-restore
        with:
          path: ${{ env.CCACHE_DIR }}
          key: >-
            ${{ env.CCACHE_REAL_KEY }}-${{ runner.os }}-${{ github.ref_name }}
          restore-keys: |
            ${{ env.CCACHE_REAL_KEY }}-${{ runner.os }}-

      - name: 初始化并配置 ccache
        run: |
          {
            echo "CCACHE_COMPILERCHECK=string:%compiler% -v"
            echo "CCACHE_BASEDIR=${{ github.workspace }}"
            echo "CCACHE_NOHASHDIR=true"
            echo "CCACHE_NOHARDLINK=true"
          } >> $GITHUB_ENV
          mkdir -p "${{ env.CCACHE_DIR }}"
          ccache -M "${{ env.CCACHE_MAXSIZE }}"
          ccache -o compression=true
          ccache -s

      - name: 下载 magiskboot 工具（仅用于解包/重打包 boot.img，与 Root 无关）
        run: |
          cd kernel_workspace

          echo "正在获取 Magisk 最新 Release 信息..."
          MAGISK_API=$(curl -fsSL https://api.github.com/repos/topjohnwu/Magisk/releases/latest)

          MAGISK_APK_URL=$(echo "$MAGISK_API" | jq -r '.assets[] | select(.name | endswith(".apk") and (contains("debug") | not)) | .browser_download_url' | head -n 1)

          if [ -z "$MAGISK_APK_URL" ] || [ "$MAGISK_APK_URL" == "null" ]; then
            echo "::error::无法获取 Magisk APK 下载链接"
            exit 1
          fi

          MAGISK_APK_FILE="magisk.apk"
          echo "正在下载 Magisk APK: $MAGISK_APK_URL"
          curl -fL -o "$MAGISK_APK_FILE" "$MAGISK_APK_URL"

          echo "正在从 Magisk APK 中提取 magiskboot..."
          if ! unzip -j "$MAGISK_APK_FILE" "lib/x86_64/libmagiskboot.so" -d . 2>/dev/null; then
            echo "::warning::标准路径不存在，列出 APK 内 magiskboot 相关文件："
            unzip -l "$MAGISK_APK_FILE" | grep -i magiskboot || true
            echo "::error::无法从 Magisk APK 中提取 magiskboot"
            exit 1
          fi

          mv libmagiskboot.so magiskboot
          chmod +x magiskboot
          rm -f "$MAGISK_APK_FILE"

          ./magiskboot --help > /dev/null 2>&1 || true
          echo "✅ magiskboot 就绪（仅打包工具，非 Root 方案）"

      - name: 应用 Droidspaces kABI 补丁
        run: |
          cd kernel_workspace/common
          echo "========================================="
          echo "正在应用 Droidspaces GKI kABI 补丁..."
          echo "========================================="
          curl -fLo fix_sysvipc_kabi_6_7_8.patch https://raw.githubusercontent.com/ravindu644/Droidspaces-OSS/main/Documentation/resources/kernel-patches/GKI/below-kernel-6.12/001.GKI-below-6.12-fix_sysvipc_kabi_6_7_8.patch

          if patch -p1 -F 3 --dry-run < fix_sysvipc_kabi_6_7_8.patch > /dev/null 2>&1; then
            patch -p1 -F 3 < fix_sysvipc_kabi_6_7_8.patch
            echo "✅ kABI 补丁干净应用"
          else
            echo "::warning::kABI 补丁无法干净应用，尝试 fuzz 应用..."
            if patch -p1 -F 3 < fix_sysvipc_kabi_6_7_8.patch; then
              echo "✅ kABI 补丁（fuzz）应用成功"
            else
              echo "::warning::kABI 补丁应用失败。开 IPC_NS 后 kABI 可能不兼容，若刷入后崩溃请检查此补丁。"
            fi
          fi
          rm -f fix_sysvipc_kabi_6_7_8.patch

      - name: 提取原厂配置并执行微创手术
        run: |
          WORKDIR="$(pwd)"
          export PATH="/usr/lib/ccache:$PATH"
          export PATH="$WORKDIR/kernel_workspace/clang18/bin:$PATH"
          export PATH="$WORKDIR/kernel_workspace/build-tools/bin:$PATH"
          cd kernel_workspace

          # ===== 1. 解包原厂 boot.img =====
          echo "正在解包原厂 boot.img..."
          mkdir -p unpack_dir
          cd unpack_dir
          ../magiskboot unpack ../stock_boot.img
          cd ..

          if [ ! -f unpack_dir/kernel ]; then
            echo "::error::解包失败，unpack_dir/kernel 不存在"
            exit 1
          fi
          echo "✅ 解包成功，unpack_dir 内容："
          ls -la unpack_dir/

          # ===== 2. 提取原厂 .config =====
          echo "正在用 extract-ikconfig 提取原厂配置..."
          cd common
          mkdir -p out
          ./scripts/extract-ikconfig ../unpack_dir/kernel > out/.config 2>/dev/null || true
          cd ..

          CONFIG_LINES=$(wc -l < common/out/.config 2>/dev/null || echo "0")
          if [ "$CONFIG_LINES" -gt 1000 ]; then
            echo "✅ 成功提取原厂 .config (共 $CONFIG_LINES 行)！"
            echo "原厂 CONFIG_LOCALVERSION:"
            grep '^CONFIG_LOCALVERSION=' common/out/.config || echo "  (未设置)"
            echo "原厂 CONFIG_IKCONFIG:"
            grep '^CONFIG_IKCONFIG' common/out/.config || echo "  (未设置)"

            # 保存提取的原厂配置，用于后续对比
            cp common/out/.config common/stock_extracted.config

            # 快照原厂 =y 和 =m 的符号列表
            grep -E '^CONFIG_[A-Z0-9_]+=y' common/stock_extracted.config | cut -d= -f1 | sort > common/orig_y_list.txt
            grep -E '^CONFIG_[A-Z0-9_]+=m' common/stock_extracted.config | cut -d= -f1 | sort > common/orig_m_list.txt
            echo "原厂 =y 项数: $(wc -l < common/orig_y_list.txt)"
            echo "原厂 =m 项数: $(wc -l < common/orig_m_list.txt)"
          else
            echo "::warning::未能从原厂 boot.img 提取配置（可能原厂未开启 CONFIG_IKCONFIG 或 kernel 格式不支持）。"
            echo "正在回退到 gki_defconfig + vendor merge 方案..."
            cd common
            make -j$(nproc --all) LLVM=1 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
              CC="ccache clang" LD="ld.lld" HOSTLD=ld.lld O=out \
              KCFLAGS+=-O2 KCFLAGS+=-Wno-error gki_defconfig
            ARCH=arm64 ./scripts/kconfig/merge_config.sh -m -O out \
              out/.config \
              arch/arm64/configs/vendor/sun_perf.config \
              arch/arm64/configs/vendor/oplus/sun_perf.config
            cd ..
          fi

          # ===== 3. 微创注入 =====
          echo "正在执行微创手术：添加 Droidspaces 缺失配置..."
          ./common/scripts/config --file ./common/out/.config \
            --enable NAMESPACES \
            --enable MULTIUSER \
            --enable PID_NS \
            --enable IPC_NS \
            --enable SYSVIPC \
            --enable POSIX_MQUEUE \
            --enable DEVTMPFS \
            --enable IKCONFIG \
            --enable IKCONFIG_PROC

          # ===== 4. olddefconfig =====
          cd common
          make -j$(nproc --all) LLVM=1 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            CC="ccache clang" LD="ld.lld" HOSTLD=ld.lld O=out olddefconfig
          cd ..

          # ===== 5. 配置变化统计（只读，不阻断） =====
          if [ -f common/stock_extracted.config ] && [ -f common/orig_y_list.txt ]; then
            echo "========================================="
            echo "配置变化统计（原厂 vs 新配置）"
            echo "========================================="

            grep -E '^CONFIG_[A-Z0-9_]+=y' common/out/.config | cut -d= -f1 | sort > common/new_y_list.txt
            grep -E '^CONFIG_[A-Z0-9_]+=[my]' common/out/.config | cut -d= -f1 | sort > common/new_my_list.txt

            ORIG_Y=$(wc -l < common/orig_y_list.txt)
            NEW_Y=$(wc -l < common/new_y_list.txt)

            comm -23 common/orig_y_list.txt common/new_y_list.txt > common/lost_y.txt
            LOST_Y=$(wc -l < common/lost_y.txt)

            comm -13 common/orig_y_list.txt common/new_y_list.txt > common/added_y.txt
            ADDED_Y=$(wc -l < common/added_y.txt)

            echo "原厂 =y 项数:       $ORIG_Y"
            echo "新配置 =y 项数:     $NEW_Y"
            echo "丢失（原厂有→无）: $LOST_Y"
            echo "新增（原厂无→有）: $ADDED_Y"

            if [ "$LOST_Y" -gt 0 ]; then
              echo ""
              echo "丢失项列表（前 30 个）："
              head -30 common/lost_y.txt

              HW_LOST=$(grep -cE 'CONFIG_(DRM|VIDEO|INPUT|SOUND|NET|USB|MMC|SCSI|POWER|REGULATOR|CLK|I2C|SPI|GPIO|PINCONF|THERMAL|HWMON|LEDS|BACKLIGHT|BATTERY|CHARGER|PHY|PCIE|UFS|NAND|MTD)_' common/lost_y.txt || echo "0")
              if [ "$HW_LOST" -gt 0 ]; then
                echo ""
                echo "其中硬件相关丢失项："
                grep -E 'CONFIG_(DRM|VIDEO|INPUT|SOUND|NET|USB|MMC|SCSI|POWER|REGULATOR|CLK|I2C|SPI|GPIO|PINCONF|THERMAL|HWMON|LEDS|BACKLIGHT|BATTERY|CHARGER|PHY|PCIE|UFS|NAND|MTD)_' common/lost_y.txt | head -30
              fi
            fi

            if [ "$LOST_Y" -gt 50 ]; then
              echo "::warning::丢失 $LOST_Y 个原厂 =y 项，源码版本可能偏差较大，刷入后请重点测硬件。"
            elif [ "$LOST_Y" -gt 10 ]; then
              echo "::notice::丢失 $LOST_Y 个原厂 =y 项，属正常版本差异范围。"
            else
              echo "✅ 丢失极少 ($LOST_Y)，源码版本高度匹配。"
            fi

            if [ -f common/orig_m_list.txt ]; then
              comm -23 common/orig_m_list.txt common/new_my_list.txt > common/lost_m.txt
              LOST_M=$(wc -l < common/lost_m.txt)
              echo ""
              echo "丢失的原厂 =m 项数: $LOST_M"
              if [ "$LOST_M" -gt 0 ]; then
                echo "丢失模块项（前 20 个）："
                head -20 common/lost_m.txt
                echo "::warning::丢失 $LOST_M 个原厂模块项，对应 .ko 可能无法加载，刷入后留意硬件。"
              fi
            fi
          else
            echo "::notice::未提取到原厂配置，跳过配置变化统计。"
          fi

          # ===== 6. 断言检查 =====
          echo "========================================="
          echo "正在执行断言检查 (验证 olddefconfig 后的最终配置)..."
          echo "========================================="
          ASSERT_PASS=true
          for CONFIG in CONFIG_NAMESPACES CONFIG_MULTIUSER CONFIG_PID_NS CONFIG_IPC_NS CONFIG_SYSVIPC CONFIG_POSIX_MQUEUE CONFIG_DEVTMPFS CONFIG_IKCONFIG CONFIG_IKCONFIG_PROC; do
            if grep -q "^${CONFIG}=y" common/out/.config; then
              echo "  [✓] $CONFIG"
            else
              echo "  [✗] $CONFIG 未开启！"
              ASSERT_PASS=false
            fi
          done

          if [ "$ASSERT_PASS" = false ]; then
            echo "::error::断言失败：关键配置未成功写入 .config"
            exit 1
          fi
          echo "✅ 断言检查通过！"

      - name: 编译内核
        run: |
          WORKDIR="$(pwd)"
          export PATH="/usr/lib/ccache:$PATH"
          export PATH="$WORKDIR/kernel_workspace/clang18/bin:$PATH"
          export PATH="$WORKDIR/kernel_workspace/build-tools/bin:$PATH"
          cd kernel_workspace/common

          make -j$(nproc --all) LLVM=1 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            CC="ccache clang" LD="ld.lld" HOSTLD=ld.lld O=out \
            KCFLAGS+=-O2 KCFLAGS+=-Wno-error Image

          echo "内核编译完成！"
          ccache -s
          ls -la out/arch/arm64/boot/Image

      - name: 生成 boot.img 并进行无损校验
        id: create_bootimg
        run: |
          cd kernel_workspace

          # ===== 1. 替换 kernel =====
          cp common/out/arch/arm64/boot/Image unpack_dir/kernel
          echo "✅ 已替换新内核 (Image)"

          # ===== 2. 重新打包 =====
          cd unpack_dir
          ../magiskboot repack ../stock_boot.img ../new-boot.img
          if [ $? -ne 0 ]; then
            echo "::error::magiskboot repack 失败！"
            exit 1
          fi
          cd ..

          # ===== 3. 重打包完整性校验 =====
          echo "========================================="
          echo "正在校验重打包后的 boot.img..."
          echo "========================================="
          rm -rf repack_check
          mkdir -p repack_check
          cd repack_check
          ../magiskboot unpack ../new-boot.img

          # 3.1 Ramdisk 校验
          if [ -f ../unpack_dir/ramdisk.cpio ]; then
            if cmp -s ../unpack_dir/ramdisk.cpio ramdisk.cpio; then
              echo "  [✓] Ramdisk 内容一致"
            else
              echo "::warning::Ramdisk 内容不同（可能是 magiskboot 重新压缩，不一定有问题）"
            fi
          else
            echo "  [ℹ] 原厂 boot.img 无 ramdisk（ramdisk 可能在 init_boot 中）"
          fi

          # 3.2 DTB 校验（动态检测 dtb / kernel_dtb）
          DTB_CHECKED=0
          for DTB_FILE in dtb kernel_dtb; do
            if [ -f "../unpack_dir/$DTB_FILE" ]; then
              DTB_CHECKED=1
              if [ -f "$DTB_FILE" ]; then
                HASH_ORIG=$(md5sum "../unpack_dir/$DTB_FILE" | awk '{print $1}')
                HASH_NEW=$(md5sum "$DTB_FILE" | awk '{print $1}')
                if [ "$HASH_ORIG" == "$HASH_NEW" ]; then
                  echo "  [✓] $DTB_FILE 校验通过 (MD5: $HASH_ORIG)"
                else
                  echo "::error::[✗] $DTB_FILE 校验失败！数据已损坏或丢失！"
                  exit 1
                fi
              else
                echo "::error::[✗] 原厂有 $DTB_FILE，但 repack 后丢失！"
                exit 1
              fi
            fi
          done
          if [ "$DTB_CHECKED" -eq 0 ]; then
            echo "  [ℹ] 原厂 boot.img 无独立 dtb（dtb 可能在 vendor_boot.img 中，本次修改不涉及）"
          fi

          # 3.3 Kernel 替换提示
          if [ -f kernel ]; then
            HASH_IMG=$(md5sum ../common/out/arch/arm64/boot/Image | awk '{print $1}')
            HASH_KERNEL=$(md5sum kernel | awk '{print $1}')
            if [ "$HASH_IMG" == "$HASH_KERNEL" ]; then
              echo "  [✓] Kernel 替换校验通过（未压缩，md5 一致）"
            else
              echo "  [ℹ] Kernel md5 不同（原厂可能是压缩格式，magiskboot 自动压缩了新 Image，属正常）"
              echo "      新 Image:   $HASH_IMG"
              echo "      包内 kernel: $HASH_KERNEL"
            fi
          fi

          # 3.4 文件大小检查
          ORIG_SIZE=$(stat -c%s ../stock_boot.img)
          NEW_SIZE=$(stat -c%s ../new-boot.img)
          echo "  [ℹ] 原厂 boot.img: $ORIG_SIZE bytes"
          echo "  [ℹ] 新 boot.img:   $NEW_SIZE bytes"

          if [ "$NEW_SIZE" -lt 10000000 ]; then
            echo "::error::[✗] 新 boot.img 小于 10MB，打包异常！"
            exit 1
          fi

          echo "✅ 无损校验完成！"
          cd ..

          # ===== 4. 输出最终文件 =====
          BOOTIMG_NAME="droidspaces-extract-boot.img"
          mv new-boot.img "${BOOTIMG_NAME}"
          echo "bootimg_name=${BOOTIMG_NAME}" >> $GITHUB_OUTPUT
          ls -la "${BOOTIMG_NAME}"
          echo "✅ boot.img 生成完成！注意：不含 Root，需自行获取 root 权限。"

      - name: 保存 ccache 缓存
        if: steps.ccache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: >-
            ${{ env.CCACHE_REAL_KEY }}-${{ runner.os }}-${{ github.ref_name }}

      - name: 上传 boot.img 工件
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.create_bootimg.outputs.bootimg_name }}
          path: kernel_workspace/${{ steps.create_bootimg.outputs.bootimg_name }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - name: 下载 boot.img 工件
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.bootimg_name }}
          path: ./release

      - name: 设置环境变量
        run: |
          FULL_VERSION="${{ env.KERNEL_VERSION }}.${{ env.SUB_VERSION }}"
          echo "FULL_VERSION=$FULL_VERSION" >> $GITHUB_ENV
          TIME="$(TZ='Asia/Shanghai' date +'%y%m%d%H%M%S')"
          echo "TIME=$TIME" >> $GITHUB_ENV
          echo "TAG_HEAD=LineageOS-23.2-hummer-Droidspaces" >> $GITHUB_ENV

      - name: 创建 Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo '### 📱 LineageOS 23.2 Kernel for hummer (Droidspaces 微创版)'
            echo ''
            echo "- **内核版本**: ${{ env.FULL_VERSION }}"
            echo '- **目标设备**: OnePlus Ace 5 Pro (hummer)'
            echo '- **变更**: 优先基于原厂 `.config` 提取，仅补 `PID_NS` / `IPC_NS` / `DEVTMPFS` 及其依赖链'
            echo '- **Root 方案**: **本镜像不含 Root**，需自行获取 root 权限'
            echo ''
            echo '### 📱 刷入说明'
            echo ''
            echo '1. 下载下方的 `droidspaces-extract-boot.img`。'
            echo '2. 自行获取 root 权限。'
            echo '3. 刷入本镜像后重启，确认 root 可用。'
            echo '4. 运行 Droidspaces。'
            echo ''
            echo '### 🔍 刷入后验证'
            echo '```bash'
            echo 'su'
            echo 'zcat /proc/config.gz | grep -E "CONFIG_(NAMESPACES|PID_NS|IPC_NS|SYSVIPC)="'
            echo 'unshare --pid --fork true; echo "pid_ns=$?"'
            echo 'unshare --ipc --fork true; echo "ipc_ns=$?"'
            echo '```'
            echo ''
            echo '⚠️ **免责声明**: 刷写第三方内核存在风险。若刷入后无法开机，请通过 fastboot 刷回原厂 boot.img。'
          } > release_notes.md

          gh release create "${{ env.TAG_HEAD }}-${{ env.TIME }}" \
            --repo "${{ github.repository }}" \
            --title "${{ env.TAG_HEAD }}-v${{ env.TIME }}" \
            --notes-file release_notes.md \
            release/*.img
