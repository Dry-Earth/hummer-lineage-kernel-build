name: LineageOS 23.2 Kernel for hummer (6.6.144) [Direct Patched Boot via KSU-Next]

env:
  TZ: Asia/Shanghai
  ANDROID_VERSION: 'android16'
  KERNEL_VERSION: '6.6'
  SUB_VERSION: '144'
  KERNEL_NAME: 'lineageos-23.2-hummer'
  CCACHE_KEY: ccache-lineageos23.2-6.6.144
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 5G
  OFFICIAL_BOOT_URL: "https://mirrorbits.lineageos.org/full/hummer/20261009/boot.img"

on:
  workflow_dispatch:
    inputs:
      ksu_type:
        description: 'Root 管理器'
        required: true
        type: choice
        default: 'ksunext'
        options:
          - 'ksunext'
          - 'none'
      enable_droidspaces:
        description: '是否启用 Droidspaces 容器支持'
        required: true
        type: boolean
        default: true
      ccache_update:
        description: '强制更新 ccache 缓存'
        required: true
        type: boolean
        default: 'false'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    outputs:
      ksuver: ${{ steps.ksu_version.outputs.ksuver }}
      bootimg_name: ${{ steps.patch_boot.outputs.bootimg_name }}
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: 下载 LineageOS 官方 boot.img 作为模板
        run: |
          echo "正在下载 LineageOS 官方 boot.img..."
          curl -fLo stock_boot.img "${{ env.OFFICIAL_BOOT_URL }}"
          if [ ! -f "stock_boot.img" ]; then
            echo "::error::下载 stock_boot.img 失败"
            exit 1
          fi
          echo "✅ 官方 boot.img 下载成功"

      - name: 安装环境依赖
        run: |
          sudo apt update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libncurses-dev libncurses5-dev dwarves \
            libssl-dev libelf-dev aria2 unzip zip git wget ccache patch \
            gcc-aarch64-linux-gnu jq

      - name: 初始化内核源码与工具链
        run: |
          rm -rf kernel_workspace
          mkdir kernel_workspace
          cd kernel_workspace

          echo "正在克隆 LineageOS 官方 SM8750 内核源码..."
          git clone --depth=1 --branch lineage-23.2 https://github.com/LineageOS/android_kernel_oneplus_sm8750.git common

          echo "正在克隆 LineageOS SM8750 专有模块源码..."
          git clone --depth=1 --branch lineage-23.2 https://github.com/LineageOS/android_kernel_oneplus_sm8750-modules.git sm8750-modules

          echo "正在下载 LineageOS 官方 LLVM/Clang (r547379)..."
          mkdir -p clang18
          
          aria2c -s 16 -x 16 -k 1M \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android16-qpr2-release/clang-r547379.tar.gz \
            -o clang-r547379.tar.gz
            
          echo "正在解压 Clang 工具链..."
          tar -xzf clang-r547379.tar.gz -C clang18
          rm -f clang-r547379.tar.gz
          
          if [ ! -f "clang18/bin/clang" ]; then
            echo "::error::Clang 工具链路径异常，未找到 clang18/bin/clang"
            exit 1
          fi
          echo "✅ 官方 Clang 工具链校验通过"

      - name: 计算 ccache 真实 Key
        run: |
          DS_FLAG="${{ inputs.enable_droidspaces }}"
          echo "CCACHE_REAL_KEY=${CCACHE_KEY}-${{ inputs.ksu_type }}-ds${DS_FLAG}" >> "$GITHUB_ENV"

      - name: 载入 ccache 缓存
        uses: actions/cache@v4
        id: ccache-restore
        with:
          path: ${{ env.CCACHE_DIR }}
          key: >-
            ${{ env.CCACHE_REAL_KEY }}-${{ runner.os }}-${{ github.ref_name }}${{ inputs.ccache_update && format('-u{0}', github.run_id) || '' }}
          restore-keys: |
            ${{ env.CCACHE_REAL_KEY }}-${{ runner.os }}-${{ github.ref_name }}
            ${{ env.CCACHE_REAL_KEY }}-${{ runner.os }}-

      - name: 初始化并配置 ccache
        run: |
          {
            echo "CCACHE_COMPILERCHECK=string:%compiler% -v"
            echo "CCACHE_BASEDIR=${{ github.workspace }}"
            echo "CCACHE_NOHASHDIR=true"
            echo "CCACHE_NOHARDLINK=true"
          } >> $GITHUB_ENV
          mkdir -p "${{ env.CCACHE_DIR }}"
          ccache -M "${{ env.CCACHE_MAXSIZE }}"
          ccache -o compression=true
          ccache -s

      - name: 添加 KernelSU Next
        id: ksu_version
        env:
          KSUNEXT_REF: dev
        run: |
          cd kernel_workspace
          KSUVER=""
          if [[ "${{ inputs.ksu_type }}" == "ksunext" ]]; then
            echo "正在配置 KernelSU Next..."
            curl -fLSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/${KSUNEXT_REF}/kernel/setup.sh" | bash -s "${KSUNEXT_REF}"
            cd KernelSU-Next
            rm -rf .git || true
            COMMIT_COUNT=$(curl -sI "https://api.github.com/repos/KernelSU-Next/KernelSU-Next/commits?sha=${KSUNEXT_REF}&per_page=1" | grep -i "link:" | sed -n 's/.*page=\([0-9]*\)>; rel="last".*/\1/p')
            COMMIT_COUNT=${COMMIT_COUNT:-0}
            [[ "$COMMIT_COUNT" =~ ^[0-9]+$ ]] || COMMIT_COUNT=0
            KSUVER=$((COMMIT_COUNT + 30000))
            cd ..
          else
            echo "已选择无内置 KernelSU 模式，跳过。"
          fi
          echo "KSUVER=${KSUVER}" >> $GITHUB_ENV
          echo "ksuver=${KSUVER}" >> $GITHUB_OUTPUT

      - name: 应用 Droidspaces kABI 补丁
        if: inputs.enable_droidspaces == true
        run: |
          cd kernel_workspace/common
          curl -fLo kabi_patch.patch https://raw.githubusercontent.com/ravindu644/Droidspaces-OSS/main/Documentation/resources/kernel-patches/GKI/below-kernel-6.12/001.GKI-below-6.12-fix_sysvipc_kabi_6_7_8.patch
          if patch -p1 --dry-run < kabi_patch.patch > /dev/null 2>&1; then
            patch -p1 < kabi_patch.patch
            echo "✅ kABI 补丁应用成功"
          else
            echo "::warning::kABI 补丁应用失败或已应用"
          fi
          rm -f kabi_patch.patch

      - name: 直接修改 gki_defconfig
        run: |
          cd kernel_workspace/common
          DEFCONFIG="arch/arm64/configs/gki_defconfig"
          echo "CONFIG_KSU=y" >> "$DEFCONFIG"
          echo "CONFIG_SYSVIPC=y" >> "$DEFCONFIG"
          echo "CONFIG_POSIX_MQUEUE=y" >> "$DEFCONFIG"
          echo "CONFIG_IPC_NS=y" >> "$DEFCONFIG"
          echo "CONFIG_PID_NS=y" >> "$DEFCONFIG"
          echo "CONFIG_UTS_NS=y" >> "$DEFCONFIG"
          echo "CONFIG_USER_NS=y" >> "$DEFCONFIG"
          echo "CONFIG_CGROUPS=y" >> "$DEFCONFIG"
          echo "CONFIG_CGROUP_DEVICE=y" >> "$DEFCONFIG"
          echo "CONFIG_CGROUP_SCHED=y" >> "$DEFCONFIG"
          echo "CONFIG_CGROUP_FREEZER=y" >> "$DEFCONFIG"
          echo "CONFIG_MEMCG=y" >> "$DEFCONFIG"
          echo "CONFIG_DEVTMPFS=y" >> "$DEFCONFIG"
          echo "CONFIG_OVERLAY_FS=y" >> "$DEFCONFIG"
          echo "CONFIG_TMPFS_POSIX_ACL=y" >> "$DEFCONFIG"
          echo "CONFIG_TMPFS_XATTR=y" >> "$DEFCONFIG"
          echo "CONFIG_NET_NS=y" >> "$DEFCONFIG"
          echo "CONFIG_VETH=y" >> "$DEFCONFIG"
          echo "CONFIG_BRIDGE=y" >> "$DEFCONFIG"
          echo "CONFIG_NETFILTER=y" >> "$DEFCONFIG"
          echo "CONFIG_NETFILTER_ADVANCED=y" >> "$DEFCONFIG"
          echo "CONFIG_NF_CONNTRACK=y" >> "$DEFCONFIG"
          echo "CONFIG_IP_NF_IPTABLES=y" >> "$DEFCONFIG"
          echo "CONFIG_IP_NF_FILTER=y" >> "$DEFCONFIG"
          echo "CONFIG_NF_NAT=y" >> "$DEFCONFIG"
          echo "CONFIG_IP_NF_TARGET_MASQUERADE=y" >> "$DEFCONFIG"
          echo "CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y" >> "$DEFCONFIG"
          echo "CONFIG_NETFILTER_XT_TARGET_LOG=y" >> "$DEFCONFIG"
          echo "CONFIG_NETFILTER_XT_MATCH_RECENT=y" >> "$DEFCONFIG"
          echo "CONFIG_IPV6=y" >> "$DEFCONFIG"
          echo "CONFIG_IP6_NF_IPTABLES=y" >> "$DEFCONFIG"
          echo "CONFIG_IP6_NF_FILTER=y" >> "$DEFCONFIG"
          echo "CONFIG_IP6_NF_NAT=y" >> "$DEFCONFIG"
          echo "CONFIG_MACVLAN=y" >> "$DEFCONFIG"
          echo "CONFIG_NTSYNC=y" >> "$DEFCONFIG"
          echo "CONFIG_FW_LOADER=y" >> "$DEFCONFIG"
          echo "CONFIG_FW_LOADER_USER_HELPER=y" >> "$DEFCONFIG"
          echo "CONFIG_FW_LOADER_COMPRESS=y" >> "$DEFCONFIG"

      - name: 构建内核
        run: |
          WORKDIR="$(pwd)"
          export PATH="/usr/lib/ccache:$PATH"
          export PATH="$WORKDIR/kernel_workspace/clang18/bin:$PATH"
          cd kernel_workspace/common

          make -j$(nproc --all) LLVM=1 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            CC="ccache clang" LD="ld.lld" HOSTLD=ld.lld O=out \
            KCFLAGS+=-O2 KCFLAGS+=-Wno-error gki_defconfig

          echo "正在合并 vendor GKI 配置..."
          ARCH=arm64 ./scripts/kconfig/merge_config.sh -m -O out \
            out/.config \
            arch/arm64/configs/vendor/sun_perf.config \
            arch/arm64/configs/vendor/oplus/sun_perf.config

          make -j$(nproc --all) LLVM=1 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            CC="ccache clang" LD="ld.lld" HOSTLD=ld.lld O=out olddefconfig

          make -j$(nproc --all) LLVM=1 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            CC="ccache clang" LD="ld.lld" HOSTLD=ld.lld O=out \
            KCFLAGS+=-O2 KCFLAGS+=-Wno-error Image

          echo "内核编译完成！"
          ccache -s

      - name: 使用 KernelSU-Next 官方 ksud 直接修补 boot.img (GKI 模式)
        id: patch_boot
        if: inputs.ksu_type == 'ksunext'
        run: |
          cd kernel_workspace
          
          # 1. 下载 KernelSU-Next 官方提供的 ksud 工具 (Linux x86_64)
          echo "正在下载 KernelSU-Next 官方 ksud..."
          curl -fLO https://github.com/KernelSU-Next/KernelSU-Next/releases/latest/download/ksud-x86_64-unknown-linux-musl
          mv ksud-x86_64-unknown-linux-musl ksud
          chmod +x ksud
          
          if ! ./ksud --help > /dev/null 2>&1; then
            echo "::error::ksud 无法执行，请确认架构正确"
            exit 1
          fi
          echo "✅ KernelSU-Next 官方 ksud 下载成功"
          
          # 2. 通过 GitHub API 动态获取 Magisk 最新 Release 的正确文件名
          echo "正在获取 Magisk 最新 Release 信息..."
          MAGISK_RELEASE_JSON=$(curl -fsSL https://api.github.com/repos/topjohnwu/Magisk/releases/latest)
          MAGISK_APK_URL=$(echo "$MAGISK_RELEASE_JSON" | jq -r '.assets[] | select(.name | endswith(".apk") and (test("debug") | not)) | .browser_download_url' | head -n 1)
          
          if [[ -z "$MAGISK_APK_URL" ]]; then
            echo "::error::无法获取 Magisk APK 下载链接"
            exit 1
          fi
          
          echo "正在下载 Magisk APK: $MAGISK_APK_URL"
          curl -fLO "$MAGISK_APK_URL"
          MAGISK_APK_FILE=$(basename "$MAGISK_APK_URL")
          
          echo "正在从 Magisk APK 中提取 magiskboot..."
          unzip -j "$MAGISK_APK_FILE" "lib/x86_64/libmagiskboot.so" -d .
          mv libmagiskboot.so magiskboot
          chmod +x magiskboot
          rm -f "$MAGISK_APK_FILE"
          
          # 3. 复制编译好的内核
          cp common/out/arch/arm64/boot/Image .
          
          if [[ ! -f "Image" ]]; then
            echo "::error::未找到内核镜像文件"
            exit 1
          fi
          
          # 4. [已修复] 使用 ksud 修补，不指定 --kmi 参数，使用 GKI 模式
          # 因为我们的内核已经通过 CONFIG_KSU=y 内置了 KernelSU，所以不需要 LKM 模块
          echo "正在使用 ksud 修补 boot.img (GKI 模式，内核已内置 KSU)..."
          ./ksud boot-patch \
            --boot ../stock_boot.img \
            --kernel Image \
            --out ../patched_boot.img
            
          if [[ ! -f "../patched_boot.img" ]]; then
            echo "::error::ksud 修补失败，未生成 patched_boot.img"
            exit 1
          fi
          
          BOOTIMG_NAME="patched_boot_KSUNext_By_DryEarth_${{ env.KERNEL_VERSION }}.img"
          mv ../patched_boot.img "../${BOOTIMG_NAME}"
          echo "bootimg_name=${BOOTIMG_NAME}" >> $GITHUB_OUTPUT
          echo "✅ boot.img 修补完成，可直接 fastboot 刷入！"

      - name: 保存新的 ccache 缓存
        if: inputs.ccache_update || steps.ccache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: >-
            ${{ env.CCACHE_REAL_KEY }}-${{ runner.os }}-${{ github.ref_name }}${{ inputs.ccache_update && format('-u{0}', github.run_id) || '' }}

      - name: 上传 patched_boot.img 工件
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.patch_boot.outputs.bootimg_name }}
          path: ${{ github.workspace }}/${{ steps.patch_boot.outputs.bootimg_name }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - name: 下载 boot.img 工件
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.bootimg_name }}
          path: ./release_zips

      - name: 设置环境变量
        run: |
          FULL_VERSION="${{ env.KERNEL_VERSION }}.${{ env.SUB_VERSION }}"
          echo "FULL_VERSION=$FULL_VERSION" >> $GITHUB_ENV
          TIME="$(TZ='Asia/Shanghai' date +'%y%m%d%H%M%S')"
          echo "TIME=$TIME" >> $GITHUB_ENV
          echo "TAG_HEAD=LineageOS-23.2-hummer-DryEarth" >> $GITHUB_ENV

      - name: 创建 Release 发布
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo '### 📱 LineageOS 23.2 Custom Kernel for hummer'
            echo '- **构建者**: Dry-Earth'
            echo "- **内核版本**: ${{ env.FULL_VERSION }}"
            echo '- **目标设备**: OnePlus Ace 5 Pro (hummer)'
            echo '- **Root 方案**: KernelSU-Next (已预修补)'
            echo ''
            echo '### ⚡ 极简刷入说明 (无需手机 App 参与)'
            echo '1. 下载下方的 `patched_boot_*.img` 文件。'
            echo '2. 手机关机，按住 **音量减 + 电源键** 进入 Fastboot 模式并连接电脑。'
            echo '3. 在电脑命令行执行：`fastboot flash boot patched_boot_*.img`'
            echo '4. 执行：`fastboot reboot`'
            echo '5. 开机后安装 KernelSU-Next Manager App 即可管理 Root。'
            echo ''
            echo '⚠️ **免责声明**: 刷写第三方内核存在风险，请确保已备份重要数据。'
          } > release_notes.md

          gh release create "${{ env.TAG_HEAD }}-${{ env.TIME }}" \
            --repo "${{ github.repository }}" \
            --title "${{ env.TAG_HEAD }}-v${{ env.TIME }}" \
            --notes-file release_notes.md \
            release_zips/*.img
