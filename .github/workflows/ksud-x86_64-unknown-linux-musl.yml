name: LineageOS 23.2 Kernel for hummer (6.6.144) [cctv18 Proven Method]

env:
  TZ: Asia/Shanghai
  ANDROID_VERSION: 'android16'
  KERNEL_VERSION: '6.6'
  SUB_VERSION: '144'
  KERNEL_NAME: 'lineageos-23.2-hummer'
  CCACHE_KEY: ccache-lineageos23.2-6.6.144-proven
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 5G
  OFFICIAL_BOOT_URL: "https://mirrorbits.lineageos.org/full/hummer/20261009/boot.img"

on:
  workflow_dispatch:
    inputs:
      ksu_type:
        description: 'Root 管理器'
        required: true
        type: choice
        default: 'ksunext'
        options:
          - 'ksunext'
          - 'none'
      enable_droidspaces:
        description: '是否启用 Droidspaces 容器支持'
        required: true
        type: boolean
        default: true
      ccache_update:
        description: '强制更新 ccache 缓存'
        required: true
        type: boolean
        default: 'false'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    outputs:
      ksuver: ${{ steps.ksu_version.outputs.ksuver }}
      bootimg_name: ${{ steps.create_bootimg.outputs.bootimg_name }}
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: 下载 LineageOS 官方 boot.img
        run: |
          curl -f -L -C - --retry 3 --retry-delay 5 -o stock_boot.img "${{ env.OFFICIAL_BOOT_URL }}"

      - name: 安装环境依赖 & 初始化源码与工具链 (完全模仿 cctv18)
        run: |
          rm -rf kernel_workspace
          mkdir kernel_workspace
          cd kernel_workspace

          echo "正在克隆 LineageOS 官方 SM8750 内核源码..."
          git clone --depth=1 --branch lineage-23.2 https://github.com/LineageOS/android_kernel_oneplus_sm8750.git common

          echo "正在克隆 llvm-clang18 工具链 (稳定版 r510928)..."
          mkdir -p clang18
          aria2c -s16 -x16 -k1M https://github.com/cctv18/oneplus_sm8650_toolchain/releases/download/LLVM-Clang18-r510928/clang-r510928.zip -o clang.zip
          unzip -q clang.zip -d clang18
          rm -rf clang.zip

          echo "正在克隆构建工具..."
          aria2c -s16 -x16 -k1M https://github.com/cctv18/oneplus_sm8650_toolchain/releases/download/LLVM-Clang18-r510928/build-tools.zip -o build-tools.zip
          unzip -q build-tools.zip
          rm -rf build-tools.zip

          echo "去除 ABI 保护 & 去除 dirty 后缀 (模仿 cctv18 成功配置)..."
          rm -f common/android/abi_gki_protected_exports_* || true
          for f in common/scripts/setlocalversion; do
            sed -i 's/ -dirty//g' "$f"
            sed -i '$i res=$(echo "$res" | sed '\''s/-dirty//g'\'')' "$f"
          done

      - name: 计算 ccache 真实 Key
        run: |
          DS_FLAG="${{ inputs.enable_droidspaces }}"
          echo "CCACHE_REAL_KEY=${CCACHE_KEY}-${{ inputs.ksu_type }}-ds${DS_FLAG}" >> "$GITHUB_ENV"

      - name: 载入 ccache 缓存
        uses: actions/cache@v4
        id: ccache-restore
        with:
          path: ${{ env.CCACHE_DIR }}
          key: >-
            ${{ env.CCACHE_REAL_KEY }}-${{ runner.os }}-${{ github.ref_name }}${{ inputs.ccache_update && format('-u{0}', github.run_id) || '' }}
          restore-keys: |
            ${{ env.CCACHE_REAL_KEY }}-${{ runner.os }}-${{ github.ref_name }}
            ${{ env.CCACHE_REAL_KEY }}-${{ runner.os }}-

      - name: 初始化并配置 ccache
        run: |
          {
            echo "CCACHE_COMPILERCHECK=string:%compiler% -v"
            echo "CCACHE_BASEDIR=${{ github.workspace }}"
            echo "CCACHE_NOHASHDIR=true"
            echo "CCACHE_NOHARDLINK=true"
          } >> $GITHUB_ENV
          mkdir -p "${{ env.CCACHE_DIR }}"
          ccache -M "${{ env.CCACHE_MAXSIZE }}"
          ccache -o compression=true
          ccache -s

      - name: 添加 KernelSU Next
        id: ksu_version
        env:
          KSUNEXT_REF: dev
        run: |
          cd kernel_workspace
          KSUVER=""
          if [[ "${{ inputs.ksu_type }}" == "ksunext" ]]; then
            echo "正在配置 KernelSU Next..."
            curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/${KSUNEXT_REF}/kernel/setup.sh" | bash -s "${KSUNEXT_REF}"
            cd KernelSU-Next
            rm -rf .git || true
            COMMIT_COUNT=$(curl -sI "https://api.github.com/repos/KernelSU-Next/KernelSU-Next/commits?sha=${KSUNEXT_REF}&per_page=1" | grep -i "link:" | sed -n 's/.*page=\([0-9]*\)>; rel="last".*/\1/p')
            COMMIT_COUNT=${COMMIT_COUNT:-0}
            [[ "$COMMIT_COUNT" =~ ^[0-9]+$ ]] || COMMIT_COUNT=0
            KSUVER=$((COMMIT_COUNT + 30000))
            cd ..
          else
            echo "已选择无内置 KernelSU 模式，跳过。"
          fi
          echo "KSUVER=${KSUVER}" >> $GITHUB_ENV
          echo "ksuver=${KSUVER}" >> $GITHUB_OUTPUT

      - name: 应用 Droidspaces kABI 补丁 (核心防崩溃补丁)
        if: inputs.enable_droidspaces == true
        run: |
          cd kernel_workspace/common
          echo "正在应用 Droidspaces GKI kABI 补丁..."
          curl -fLo fix_sysvipc_kabi_6_7_8.patch https://raw.githubusercontent.com/ravindu644/Droidspaces-OSS/main/Documentation/resources/kernel-patches/GKI/below-kernel-6.12/001.GKI-below-6.12-fix_sysvipc_kabi_6_7_8.patch
          patch -p1 -F 3 < fix_sysvipc_kabi_6_7_8.patch || true
          echo "✅ kABI 补丁应用成功"

      - name: 直接修改 gki_defconfig (模仿 cctv18 的可靠方式，不使用 merge_config)
        run: |
          cd kernel_workspace/common
          DEFCONFIG="arch/arm64/configs/gki_defconfig"
          
          echo "CONFIG_KSU=y" >> "$DEFCONFIG"
          
          if [[ "${{ inputs.enable_droidspaces }}" == "true" ]]; then
            echo "正在追加 Droidspaces 容器支持配置..."
            echo "CONFIG_PID_NS=y" >> "$DEFCONFIG"
            echo "CONFIG_IPC_NS=y" >> "$DEFCONFIG"
            echo "CONFIG_USER_NS=y" >> "$DEFCONFIG"
            echo "CONFIG_SYSVIPC=y" >> "$DEFCONFIG"
            echo "CONFIG_DEVTMPFS=y" >> "$DEFCONFIG"
            echo "CONFIG_NAMESPACES=y" >> "$DEFCONFIG"
            echo "CONFIG_POSIX_MQUEUE=y" >> "$DEFCONFIG"
            echo "CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y" >> "$DEFCONFIG"
            echo "CONFIG_NETFILTER_XT_TARGET_LOG=y" >> "$DEFCONFIG"
            echo "CONFIG_NETFILTER_XT_MATCH_RECENT=y" >> "$DEFCONFIG"
            echo "CONFIG_NTSYNC=y" >> "$DEFCONFIG"
            echo "CONFIG_TMPFS_XATTR=y" >> "$DEFCONFIG"
            echo "CONFIG_TMPFS_POSIX_ACL=y" >> "$DEFCONFIG"
            echo "CONFIG_CGROUPS=y" >> "$DEFCONFIG"
            echo "CONFIG_CGROUP_DEVICE=y" >> "$DEFCONFIG"
            echo "CONFIG_OVERLAY_FS=y" >> "$DEFCONFIG"
            echo "✅ Droidspaces 配置追加完成"
          fi

      - name: 构建内核 (不使用 merge_config.sh，避免配置被覆盖)
        run: |
          WORKDIR="$(pwd)"
          export PATH="/usr/lib/ccache:$PATH"
          export PATH="$WORKDIR/kernel_workspace/clang18/bin:$PATH"
          export PATH="$WORKDIR/kernel_workspace/build-tools/bin:$PATH"
          cd kernel_workspace/common

          # 直接基于修改后的 gki_defconfig 编译，不合并 vendor config，排除 vendor config 冲突的可能
          make -j$(nproc --all) LLVM=1 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            CC="ccache clang" LD="ld.lld" HOSTLD=ld.lld O=out \
            KCFLAGS+=-O2 KCFLAGS+=-Wno-error gki_defconfig

          make -j$(nproc --all) LLVM=1 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            CC="ccache clang" LD="ld.lld" HOSTLD=ld.lld O=out \
            KCFLAGS+=-O2 KCFLAGS+=-Wno-error Image

          echo "内核编译完成！"
          ccache -s

      - name: 生成 boot.img (供 KSU 修补)
        id: create_bootimg
        run: |
          cd kernel_workspace
          
          # 下载 magiskboot
          curl -fLO https://github.com/topjohnwu/Magisk/releases/latest/download/Magisk.apk
          unzip -j Magisk.apk "lib/x86_64/libmagiskboot.so" -d .
          mv libmagiskboot.so magiskboot
          chmod +x magiskboot
          rm -f Magisk.apk
          
          cp common/out/arch/arm64/boot/Image .
          cp ../stock_boot.img .
          
          mkdir -p unpack_dir
          cd unpack_dir
          ../magiskboot unpack ../stock_boot.img
          cp ../Image kernel
          ../magiskboot repack ../stock_boot.img ../new-boot.img
          cd ..
          
          BOOTIMG_NAME="new-boot_KSUNext_By_DryEarth_${{ env.KERNEL_VERSION }}.img"
          mv new-boot.img "${BOOTIMG_NAME}"
          echo "bootimg_name=${BOOTIMG_NAME}" >> $GITHUB_OUTPUT
          echo "✅ boot.img 生成完成，请在手机上使用 KernelSU-Next Manager 修补！"

      - name: 保存新的 ccache 缓存
        if: inputs.ccache_update || steps.ccache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: >-
            ${{ env.CCACHE_REAL_KEY }}-${{ runner.os }}-${{ github.ref_name }}${{ inputs.ccache_update && format('-u{0}', github.run_id) || '' }}

      - name: 上传 new-boot.img 工件
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.create_bootimg.outputs.bootimg_name }}
          path: kernel_workspace/${{ steps.create_bootimg.outputs.bootimg_name }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - name: 下载 boot.img 工件
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.bootimg_name }}
          path: ./release_zips

      - name: 设置环境变量
        run: |
          FULL_VERSION="${{ env.KERNEL_VERSION }}.${{ env.SUB_VERSION }}"
          echo "FULL_VERSION=$FULL_VERSION" >> $GITHUB_ENV
          TIME="$(TZ='Asia/Shanghai' date +'%y%m%d%H%M%S')"
          echo "TIME=$TIME" >> $GITHUB_ENV
          echo "TAG_HEAD=LineageOS-23.2-hummer-DryEarth" >> $GITHUB_ENV

      - name: 创建 Release 发布
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo '### 📱 LineageOS 23.2 Custom Kernel for hummer'
            echo '- **构建者**: Dry-Earth'
            echo "- **内核版本**: ${{ env.FULL_VERSION }}"
            echo '- **目标设备**: OnePlus Ace 5 Pro (hummer)'
            echo '- **Root 方案**: KernelSU-Next (需在手机上修补)'
            echo ''
            echo '### 📱 刷入说明'
            echo '1. 下载下方的 `new-boot_*.img` 文件并传到手机。'
            echo '2. 打开 KernelSU-Next Manager App。'
            echo '3. 点击 **"安装" -> "选择并修补一个文件"**，选择该文件。'
            echo '4. 等待修补完成并重启。'
            echo ''
            echo '⚠️ **免责声明**: 刷写第三方内核存在风险。'
          } > release_notes.md

          gh release create "${{ env.TAG_HEAD }}-${{ env.TIME }}" \
            --repo "${{ github.repository }}" \
            --title "${{ env.TAG_HEAD }}-v${{ env.TIME }}" \
            --notes-file release_notes.md \
            release_zips/*.img
