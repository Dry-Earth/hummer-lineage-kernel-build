name: Build LineageOS Kernel for hummer (PKR110)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          # 添加了 lld 链接器，解决 ld.lld not found 问题
          sudo apt-get install -y git curl python3 build-essential bc bison flex libssl-dev libelf-dev lz4 zstd zip unzip lld

      - name: Setup Clang Toolchain
        run: |
          mkdir -p toolchain
          cd toolchain
          # 下载 Android 官方 Clang 工具链
          curl -L -o clang.tar.gz "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r522817.tar.gz"
          tar -xzf clang.tar.gz
          
          # 将工具链路径加入环境变量，确保 make 能找到 clang 和 ld.lld
          echo "$(pwd)/bin" >> $GITHUB_PATH
          echo "CLANG_PATH=$(pwd)/bin" >> $GITHUB_ENV

      - name: Clone LineageOS Kernel Source
        run: |
          git clone https://github.com/LineageOS/android_kernel_oneplus_sm8750.git kernel --depth=1 --branch lineage-23.2

      - name: Inject KernelSU-Next
        run: |
          cd kernel
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -
          cd ..

      - name: Configure Kernel for Droidspaces & KernelSU
        run: |
          cd kernel
          make ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 gki_defconfig vendor/oplus/sun_perf.config
          
          echo "CONFIG_KSU=y" >> .config
          echo "CONFIG_KSU_EXPECTED_SIZE=0x0" >> .config
          echo "CONFIG_KSU_EXPECTED_HASH=\"\"" >> .config
          echo "CONFIG_CGROUPS=y" >> .config
          echo "CONFIG_CGROUP_V1=y" >> .config
          echo "CONFIG_CGROUP_V2=y" >> .config
          echo "CONFIG_NAMESPACES=y" >> .config
          echo "CONFIG_PID_NS=y" >> .config
          echo "CONFIG_NET_NS=y" >> .config
          echo "CONFIG_IPC_NS=y" >> .config
          echo "CONFIG_UTS_NS=y" >> .config
          echo "CONFIG_CGROUP_NS=y" >> .config
          echo "CONFIG_OVERLAY_FS=y" >> .config
          echo "CONFIG_VETH=y" >> .config
          echo "CONFIG_BRIDGE=y" >> .config
          echo "CONFIG_BRIDGE_NETFILTER=y" >> .config
          echo "CONFIG_SECCOMP=y" >> .config
          echo "CONFIG_BLK_DEV_LOOP=y" >> .config
          echo "CONFIG_HUMMER_DTB=y" >> .config

          make ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 olddefconfig

      - name: Build Kernel
        run: |
          cd kernel
          make ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 -j$(nproc)

      - name: Prepare AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git AK3
          rm -rf AK3/.git* AK3/README.md
          find kernel/arch/arm64/boot -name "Image" -exec cp {} AK3/ \;
          sed -i 's/device.name1=.*/device.name1=hummer/' AK3/anykernel.sh
          sed -i 's/device.name2=.*/device.name2=PKR110/' AK3/anykernel.sh
          sed -i 's/do.systemless=1/do.systemless=0/' AK3/anykernel.sh

      - name: Package AnyKernel3 Zip
        run: |
          cd AK3
          zip -r9 ../LineageOS_hummer_KernelSU_Droidspaces_AK3.zip *
          cd ..

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LineageOS_hummer_KernelSU_Droidspaces_AK3
          path: LineageOS_hummer_KernelSU_Droidspaces_AK3.zip
