name: Build LineageOS Kernel for hummer (PKR110) - Droidspaces Ready

env:
  TZ: Asia/Shanghai

on:
  workflow_dispatch:
    inputs:
      ksu_type:
        description: 'KernelSU branch'
        required: true
        type: choice
        default: 'ksu'
        options:
          - 'ksu'
          - 'ksunext'
          - 'none'
      droidspaces_enable:
        description: 'Enable Droidspaces support'
        required: true
        type: choice
        default: 'standard'
        options:
          - 'standard'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl python3 build-essential bc bison flex libssl-dev libelf-dev lz4 zstd zip unzip lld patch

      - name: Download LLVM-Clang toolchain
        run: |
          mkdir -p toolchain
          cd toolchain
          curl -L -o clang.tar.gz "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r522817.tar.gz"
          tar -xzf clang.tar.gz
          echo "$(pwd)/bin" >> $GITHUB_PATH
          echo "CLANG_PATH=$(pwd)/bin" >> $GITHUB_ENV

      - name: Clone LineageOS kernel source (with sibling repos)
        run: |
          git clone https://github.com/LineageOS/android_kernel_oneplus_sm8750.git kernel --depth=1 --branch lineage-23.2
          git clone --depth=1 --branch lineage-23.2 https://github.com/LineageOS/android_kernel_oneplus_sm8750-modules.git sm8750-modules || git clone --depth=1 https://github.com/LineageOS/android_kernel_oneplus_sm8750-modules.git sm8750-modules
          git clone --depth=1 --branch lineage-23.2 https://github.com/LineageOS/android_kernel_oneplus_sm8750-devicetrees.git sm8750-devicetrees || git clone --depth=1 https://github.com/LineageOS/android_kernel_oneplus_sm8750-devicetrees.git sm8750-devicetrees
          ls -l kernel/drivers/base/kernelFwUpdate/

      - name: Inject KernelSU
        if: inputs.ksu_type != 'none'
        run: |
          cd kernel
          if [[ "${{ inputs.ksu_type }}" == "ksu" ]]; then
            echo "Injecting original KernelSU (tiann/KernelSU)..."
            curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -
          elif [[ "${{ inputs.ksu_type }}" == "ksunext" ]]; then
            echo "Injecting KernelSU Next..."
            curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -
          fi
          cd ..

      - name: Apply Droidspaces GKI kABI patch
        if: inputs.droidspaces_enable == 'standard'
        run: |
          cd kernel
          echo "Applying GKI kABI patch..."
          wget -q -O kabi.patch https://raw.githubusercontent.com/ravindu644/Droidspaces-OSS/main/Documentation/resources/kernel-patches/GKI/below-kernel-6.12/001.GKI-below-6.12-fix_sysvipc_kabi_6_7_8.patch || { echo "FATAL: kABI patch download failed"; exit 1; }
          if ! patch -p1 -F 3 < kabi.patch; then
            echo "FATAL: kABI patch failed to apply. Aborting to prevent bootloop."
            exit 1
          fi
          echo "kABI patch applied successfully."
          cd ..

      - name: Configure kernel (GKI safe, portable method)
        run: |
          cd kernel
          make ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 gki_defconfig
          enable_opt() {
            if grep -q "^# $1 is not set" .config; then
              sed -i "s|^# $1 is not set|$1=y|" .config
            elif ! grep -q "^$1=" .config; then
              echo "$1=y" >> .config
            fi
            echo "enabled: $1"
          }
          for opt in CONFIG_SYSVIPC CONFIG_POSIX_MQUEUE CONFIG_NAMESPACES CONFIG_PID_NS CONFIG_UTS_NS CONFIG_IPC_NS CONFIG_USER_NS CONFIG_SECCOMP CONFIG_SECCOMP_FILTER CONFIG_CGROUPS CONFIG_DEVTMPFS CONFIG_OVERLAY_FS CONFIG_BLK_DEV_LOOP CONFIG_NET_NS CONFIG_VETH CONFIG_BRIDGE CONFIG_NETFILTER_XT_MATCH_ADDRTYPE CONFIG_IP6_NF_NAT CONFIG_IP6_NF_TARGET_MASQUERADE CONFIG_MACVLAN CONFIG_TMPFS_POSIX_ACL CONFIG_TMPFS_XATTR; do
            enable_opt $opt
          done
          
          if [[ "${{ inputs.ksu_type }}" != "none" ]]; then
            enable_opt CONFIG_KSU
            if [[ "${{ inputs.ksu_type }}" == "ksunext" ]]; then
              if grep -q "^CONFIG_KSU_EXPECTED_SIZE=" .config; then
                sed -i 's|^CONFIG_KSU_EXPECTED_SIZE=.*|CONFIG_KSU_EXPECTED_SIZE=0x0|' .config
              else
                echo "CONFIG_KSU_EXPECTED_SIZE=0x0" >> .config
              fi
              if grep -q "^CONFIG_KSU_EXPECTED_HASH=" .config; then
                sed -i 's|^CONFIG_KSU_EXPECTED_HASH=.*|CONFIG_KSU_EXPECTED_HASH=""|' .config
              else
                echo 'CONFIG_KSU_EXPECTED_HASH=""' >> .config
              fi
            fi
          fi
          
          make ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 olddefconfig
          echo "--- verify critical options ---"
          grep -E "CONFIG_(SYSVIPC|IPC_NS|PID_NS|OVERLAY_FS|KSU)=" .config || true

      - name: Build kernel
        run: |
          cd kernel
          echo "Building kernel, this may take 20-30 minutes..."
          make ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 -j$(nproc)

      - name: Prepare AnyKernel3 (Fixed Image Copy)
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git AK3
          rm -rf AK3/.git* AK3/README.md
          
          echo "Searching for compiled kernel Image..."
          # 明确检查 LineageOS 编译输出的标准路径
          if [ -f "kernel/arch/arm64/boot/Image" ]; then
            echo "✅ Found Image at kernel/arch/arm64/boot/Image"
            cp kernel/arch/arm64/boot/Image AK3/Image
          elif [ -f "kernel/out/arch/arm64/boot/Image" ]; then
            echo "✅ Found Image at kernel/out/arch/arm64/boot/Image"
            cp kernel/out/arch/arm64/boot/Image AK3/Image
          else
            echo "❌ FATAL ERROR: Kernel Image not found in expected paths!"
            echo "Listing contents of kernel/arch/arm64/boot/:"
            ls -la kernel/arch/arm64/boot/ || true
            exit 1
          fi
          
          # 验证复制是否成功
          if [ ! -f "AK3/Image" ]; then
            echo "❌ FATAL ERROR: Failed to copy Image to AK3 directory!"
            exit 1
          fi
          
          echo "✅ Image file successfully prepared. Size:"
          ls -lh AK3/Image
          
          # 配置 AnyKernel3 脚本
          sed -i 's/device.name1=.*/device.name1=hummer/' AK3/anykernel.sh
          sed -i 's/device.name2=.*/device.name2=PKR110/' AK3/anykernel.sh
          sed -i 's/do.systemless=1/do.systemless=0/' AK3/anykernel.sh

      - name: Package AnyKernel3 zip
        run: |
          cd AK3
          zip -r9 ../LineageOS_hummer_Droidspaces_AK3.zip *
          cd ..

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LineageOS_hummer_Droidspaces_AK3
          path: LineageOS_hummer_Droidspaces_AK3.zip
