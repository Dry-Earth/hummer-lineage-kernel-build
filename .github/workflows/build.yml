name: LineageOS 23.2 Kernel for hummer (6.6.144) [Ultimate Stable]

env:
  TZ: Asia/Shanghai
  ANDROID_VERSION: 'android16'
  KERNEL_VERSION: '6.6'
  SUB_VERSION: '144'
  KERNEL_NAME: 'lineage-23.2-hummer'
  CCACHE_KEY: ccache-lineageos23.2-6.6.144
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 5G

on:
  workflow_dispatch:
    inputs:
      ksu_type:
        description: 'Root 管理器'
        required: true
        type: choice
        default: 'ksunext'
        options:
          - 'ksunext'
          - 'none'
      enable_droidspaces:
        description: '是否启用 Droidspaces 容器支持'
        required: true
        type: boolean
        default: true
      ccache_update:
        description: '强制更新 ccache 缓存'
        required: true
        type: boolean
        default: 'false'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    outputs:
      ksuver: ${{ steps.ksu_version.outputs.ksuver }}
      ak3name: ${{ steps.create_zip.outputs.ak3name }}
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: 安装环境依赖 (补全内核编译必备依赖)
        run: |
          sudo apt update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libncurses-dev libncurses5-dev dwarves \
            libssl-dev libelf-dev aria2 unzip zip git wget ccache patch \
            gcc-aarch64-linux-gnu

      - name: 初始化内核源码与工具链
        run: |
          rm -rf kernel_workspace
          mkdir kernel_workspace
          cd kernel_workspace

          echo "正在克隆 LineageOS 官方 SM8750 内核源码 (lineage-23.2)..."
          git clone --depth=1 --branch lineage-23.2 https://github.com/LineageOS/android_kernel_oneplus_sm8750.git common

          echo "正在克隆 LineageOS SM8750 专有模块源码..."
          git clone --depth=1 --branch lineage-23.2 https://github.com/LineageOS/android_kernel_oneplus_sm8750-modules.git sm8750-modules

          echo "正在下载 LineageOS 官方 LLVM/Clang (r547379 - Android 16 推荐)..."
          mkdir -p clang18
          # [核心修复] 放弃 git clone，直接使用 AOSP 官方归档下载，100% 避免 GitHub 假 404 认证错误
          curl -LO https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android16-qpr2-release/clang-r547379.tar.gz
          tar -xzf clang-r547379.tar.gz -C clang18
          rm -f clang-r547379.tar.gz
          
          if [ ! -f "clang18/bin/clang" ]; then
            echo "::error::Clang 工具链路径异常，未找到 clang18/bin/clang"
            exit 1
          fi
          echo "✅ 官方 Clang 工具链校验通过"

          echo "源码及工具链初始化完成！"

      - name: 计算 ccache 真实 Key
        run: |
          DS_FLAG="${{ inputs.enable_droidspaces }}"
          echo "CCACHE_REAL_KEY=${CCACHE_KEY}-${{ inputs.ksu_type }}-ds${DS_FLAG}" >> "$GITHUB_ENV"

      - name: 载入 ccache 缓存
        uses: actions/cache@v4
        id: ccache-restore
        with:
          path: ${{ env.CCACHE_DIR }}
          key: >-
            ${{ env.CCACHE_REAL_KEY }}-${{ runner.os }}-${{ github.ref_name }}${{ inputs.ccache_update && format('-u{0}', github.run_id) || '' }}
          restore-keys: |
            ${{ env.CCACHE_REAL_KEY }}-${{ runner.os }}-${{ github.ref_name }}
            ${{ env.CCACHE_REAL_KEY }}-${{ runner.os }}-

      - name: 初始化并配置 ccache
        run: |
          {
            echo "CCACHE_COMPILERCHECK=string:%compiler% -v"
            echo "CCACHE_BASEDIR=${{ github.workspace }}"
            echo "CCACHE_NOHASHDIR=true"
            echo "CCACHE_NOHARDLINK=true"
          } >> $GITHUB_ENV
          mkdir -p "${{ env.CCACHE_DIR }}"
          ccache -M "${{ env.CCACHE_MAXSIZE }}"
          ccache -o compression=true
          ccache -s

      - name: 添加 KernelSU Next
        id: ksu_version
        env:
          KSUNEXT_REF: dev
        run: |
          cd kernel_workspace
          KSUVER=""
          if [[ "${{ inputs.ksu_type }}" == "ksunext" ]]; then
            echo "正在配置 KernelSU Next..."
            curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/${KSUNEXT_REF}/kernel/setup.sh" | bash -s "${KSUNEXT_REF}"
            cd KernelSU-Next
            rm -rf .git || true
            COMMIT_COUNT=$(curl -sI "https://api.github.com/repos/KernelSU-Next/KernelSU-Next/commits?sha=${KSUNEXT_REF}&per_page=1" | grep -i "link:" | sed -n 's/.*page=\([0-9]*\)>; rel="last".*/\1/p')
            COMMIT_COUNT=${COMMIT_COUNT:-0}
            [[ "$COMMIT_COUNT" =~ ^[0-9]+$ ]] || COMMIT_COUNT=0
            KSUVER=$((COMMIT_COUNT + 30000))
            cd ..
          else
            echo "已选择无内置 KernelSU 模式，跳过。"
          fi
          echo "KSUVER=${KSUVER}" >> $GITHUB_ENV
          echo "ksuver=${KSUVER}" >> $GITHUB_OUTPUT

      - name: 应用 Droidspaces kABI 补丁
        if: inputs.enable_droidspaces == true
        run: |
          cd kernel_workspace/common
          echo "正在下载并应用 GKI kABI 补丁..."
          curl -Lo kabi_patch.patch https://raw.githubusercontent.com/ravindu644/Droidspaces-OSS/main/Documentation/resources/kernel-patches/GKI/below-kernel-6.12/001.GKI-below-6.12-fix_sysvipc_kabi_6_7_8.patch
          
          if patch -p1 --dry-run < kabi_patch.patch > /dev/null 2>&1; then
            patch -p1 < kabi_patch.patch
            echo "✅ kABI 补丁应用成功"
          else
            echo "::warning::kABI 补丁应用失败或已应用"
          fi
          rm -f kabi_patch.patch

      - name: 直接修改 gki_defconfig (多行 echo 绝对防报错法)
        run: |
          cd kernel_workspace/common
          DEFCONFIG="arch/arm64/configs/gki_defconfig"
          
          echo "正在向 gki_defconfig 末尾追加配置 (Kconfig 末尾优先级最高)..."
          
          echo "CONFIG_KSU=y" >> "$DEFCONFIG"
          echo "CONFIG_SYSVIPC=y" >> "$DEFCONFIG"
          echo "CONFIG_POSIX_MQUEUE=y" >> "$DEFCONFIG"
          echo "CONFIG_IPC_NS=y" >> "$DEFCONFIG"
          echo "CONFIG_PID_NS=y" >> "$DEFCONFIG"
          echo "CONFIG_UTS_NS=y" >> "$DEFCONFIG"
          echo "CONFIG_USER_NS=y" >> "$DEFCONFIG"
          echo "CONFIG_CGROUPS=y" >> "$DEFCONFIG"
          echo "CONFIG_CGROUP_DEVICE=y" >> "$DEFCONFIG"
          echo "CONFIG_CGROUP_SCHED=y" >> "$DEFCONFIG"
          echo "CONFIG_CGROUP_FREEZER=y" >> "$DEFCONFIG"
          echo "CONFIG_MEMCG=y" >> "$DEFCONFIG"
          echo "CONFIG_DEVTMPFS=y" >> "$DEFCONFIG"
          echo "CONFIG_OVERLAY_FS=y" >> "$DEFCONFIG"
          echo "CONFIG_TMPFS_POSIX_ACL=y" >> "$DEFCONFIG"
          echo "CONFIG_TMPFS_XATTR=y" >> "$DEFCONFIG"
          echo "CONFIG_NET_NS=y" >> "$DEFCONFIG"
          echo "CONFIG_VETH=y" >> "$DEFCONFIG"
          echo "CONFIG_BRIDGE=y" >> "$DEFCONFIG"
          echo "CONFIG_NETFILTER=y" >> "$DEFCONFIG"
          echo "CONFIG_NETFILTER_ADVANCED=y" >> "$DEFCONFIG"
          echo "CONFIG_NF_CONNTRACK=y" >> "$DEFCONFIG"
          echo "CONFIG_IP_NF_IPTABLES=y" >> "$DEFCONFIG"
          echo "CONFIG_IP_NF_FILTER=y" >> "$DEFCONFIG"
          echo "CONFIG_NF_NAT=y" >> "$DEFCONFIG"
          echo "CONFIG_IP_NF_TARGET_MASQUERADE=y" >> "$DEFCONFIG"
          echo "CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y" >> "$DEFCONFIG"
          echo "CONFIG_NETFILTER_XT_TARGET_LOG=y" >> "$DEFCONFIG"
          echo "CONFIG_NETFILTER_XT_MATCH_RECENT=y" >> "$DEFCONFIG"
          echo "CONFIG_IPV6=y" >> "$DEFCONFIG"
          echo "CONFIG_IP6_NF_IPTABLES=y" >> "$DEFCONFIG"
          echo "CONFIG_IP6_NF_FILTER=y" >> "$DEFCONFIG"
          echo "CONFIG_IP6_NF_NAT=y" >> "$DEFCONFIG"
          echo "CONFIG_MACVLAN=y" >> "$DEFCONFIG"
          echo "CONFIG_NTSYNC=y" >> "$DEFCONFIG"
          echo "CONFIG_FW_LOADER=y" >> "$DEFCONFIG"
          echo "CONFIG_FW_LOADER_USER_HELPER=y" >> "$DEFCONFIG"
          echo "CONFIG_FW_LOADER_COMPRESS=y" >> "$DEFCONFIG"
          
          echo "✅ gki_defconfig 修改完成"

      - name: 构建内核
        run: |
          WORKDIR="$(pwd)"
          export PATH="/usr/lib/ccache:$PATH"
          export PATH="$WORKDIR/kernel_workspace/clang18/bin:$PATH"
          cd kernel_workspace/common

          make -j$(nproc --all) LLVM=1 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            CC="ccache clang" LD="ld.lld" HOSTLD=ld.lld O=out \
            KCFLAGS+=-O2 KCFLAGS+=-Wno-error gki_defconfig

          echo "正在合并 vendor GKI 配置..."
          ARCH=arm64 ./scripts/kconfig/merge_config.sh -m -O out \
            out/.config \
            arch/arm64/configs/vendor/sun_perf.config \
            arch/arm64/configs/vendor/oplus/sun_perf.config

          make -j$(nproc --all) LLVM=1 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            CC="ccache clang" LD="ld.lld" HOSTLD=ld.lld O=out olddefconfig

          make -j$(nproc --all) LLVM=1 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            CC="ccache clang" LD="ld.lld" HOSTLD=ld.lld O=out \
            KCFLAGS+=-O2 KCFLAGS+=-Wno-error Image

          echo "内核编译完成！"
          ccache -s

      - name: 打包内核 (使用官方 AnyKernel3 并完美配置)
        id: create_zip
        run: |
          cd kernel_workspace
          
          git clone https://github.com/osm0sis/AnyKernel3 --depth=1 packager
          rm -rf packager/.git
          
          cp common/out/arch/arm64/boot/Image packager/Image
          
          if [[ ! -f packager/Image ]]; then
            echo "::error::未找到内核镜像文件"
            exit 1
          fi
          
          # 完美配置 anykernel.sh 以适配 hummer + GKI 2.0 + UFS 存储
          sed -i 's/^block=.*/block=auto/g' packager/anykernel.sh
          sed -i 's/^device.name1=.*/device.name1=hummer/g' packager/anykernel.sh
          sed -i 's/^device.name2=.*/device.name2=/g' packager/anykernel.sh
          sed -i 's/^do.devicecheck=.*/do.devicecheck=1/g' packager/anykernel.sh
          sed -i 's/^dtb=.*/dtb=/g' packager/anykernel.sh
          sed -i 's/^dtb2=.*/dtb2=/g' packager/anykernel.sh
          sed -i 's/by.*/by Dry-Earth/g' packager/anykernel.sh
          
          KSU_TYPENAME="KSUNext"
          AK3_NAME="Kernel_${KSU_TYPENAME}_By_DryEarth_${{ env.KERNEL_VERSION }}.zip"
          
          cd packager
          zip -r "../${AK3_NAME}" ./*
          cd ..
          
          echo "ak3name=${AK3_NAME}" >> $GITHUB_OUTPUT

      - name: 保存新的 ccache 缓存
        if: inputs.ccache_update || steps.ccache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: >-
            ${{ env.CCACHE_REAL_KEY }}-${{ runner.os }}-${{ github.ref_name }}${{ inputs.ccache_update && format('-u{0}', github.run_id) || '' }}

      - name: 上传 ZIP 工件
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.create_zip.outputs.ak3name }}
          path: ${{ github.workspace }}/kernel_workspace/${{ steps.create_zip.outputs.ak3name }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - name: 下载 ZIP 工件
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.ak3name }}
          path: ./release_zips

      - name: 设置环境变量
        run: |
          FULL_VERSION="${{ env.KERNEL_VERSION }}.${{ env.SUB_VERSION }}"
          echo "FULL_VERSION=$FULL_VERSION" >> $GITHUB_ENV
          TIME="$(TZ='Asia/Shanghai' date +'%y%m%d%H%M%S')"
          echo "TIME=$TIME" >> $GITHUB_ENV
          echo "TAG_HEAD=LineageOS-23.2-hummer-DryEarth" >> $GITHUB_ENV

      - name: 创建 Release 发布
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo '### 📱 LineageOS 23.2 Custom Kernel for hummer'
            echo '- **构建者**: Dry-Earth'
            echo "- **内核版本**: ${{ env.FULL_VERSION }}"
            echo '- **目标设备**: OnePlus Ace 5 Pro (hummer)'
            echo '- **Root 方案**: KernelSU-Next'
            echo ''
            echo '### 🛡️ 核心特性'
            echo '- ✅ 补全所有内核编译必备依赖'
            echo '- ✅ 使用 AOSP 官方归档下载 LLVM 19 (r547379)，100% 避免 Git 认证错误'
            echo '- ✅ 已应用官方 GKI kABI 补丁'
            echo '- ✅ 使用官方 AnyKernel3 并强制保留原厂 dtb (防重启)'
            echo '- ✅ 强制 block=auto 完美适配 UFS 4.0 存储'
            echo '- ✅ 保留原厂内核版本号与 ABI 保护符号'
            echo ''
            echo '⚠️ **免责声明**: 刷写第三方内核存在风险。'
          } > release_notes.md

          gh release create "${{ env.TAG_HEAD }}-${{ env.TIME }}" \
            --repo "${{ github.repository }}" \
            --title "${{ env.TAG_HEAD }}-v${{ env.TIME }}" \
            --notes-file release_notes.md \
            release_zips/*.zip
