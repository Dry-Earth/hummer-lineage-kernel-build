name: Build hummer boot.img from OTA (auto manifest)

# 输入任意 LineageOS hummer OTA 的 boot.img + build-manifest.xml：
#   1. 从 manifest 解析 kernel / modules / devicetrees / clang 的精确 revision
#   2. 从 boot.img 提取真实 config、完整 release、原厂 clang 版本
#   3. 自动下载对应 clang，编译 stock baseline + 容器增强 Image
#   4. 用 pahole 比较关键结构体，防止 kABI 被容器选项破坏
#   5. 只替换 boot.img 里的 Image，重新打包
#
# 不写死 kernel SHA / release / clang；以后 OTA 只需要换两个 URL。

on:
  workflow_dispatch:
    inputs:
      boot_img_url:
        description: 'OTA boot.img URL'
        required: true
        type: string
        default: 'https://mirrorbits.lineageos.org/full/hummer/20261106/boot.img'
      manifest_url:
        description: 'OTA build-manifest.xml URL'
        required: true
        type: string
        default: 'https://mirrorbits.lineageos.org/full/hummer/20261106/build-manifest.xml'
      publish_release:
        description: '构建成功后发布 Release'
        required: true
        type: boolean
        default: true
      extra_container_options:
        description: '额外开启容器常用项（CGROUP_DEVICE / TMPFS ACL+XATTR / iptables REJECT+LOG+RECENT / ipset）'
        required: true
        type: boolean
        default: true
      enable_user_ns:
        description: '开启原生 CONFIG_USER_NS（容器沙箱/rootless；比 LKM live patch 更稳）'
        required: true
        type: boolean
        default: true
      enable_bridge_netfilter:
        description: '开启 BRIDGE_NETFILTER（Docker bridge 过滤需要）'
        required: true
        type: boolean
        default: true
      enable_macvlan:
        description: '开启 MACVLAN（容器独立 IP）'
        required: true
        type: boolean
        default: false
      enable_ipv6_nat:
        description: '开启 IPv6 NAT（部分 OPPO 机型可能有 VINTF 提示）'
        required: true
        type: boolean
        default: false
      verify_kabi:
        description: '编译 stock baseline 并用 pahole 比较结构体布局（更慢，但能提前发现 kABI 破坏）'
        required: true
        type: boolean
        default: true

permissions:
  contents: write

env:
  KERNEL_REPO: LineageOS/android_kernel_oneplus_sm8750
  KERNEL_BRANCH: lineage-24.0
  MODULES_REPO: LineageOS/android_kernel_oneplus_sm8750-modules
  MODULES_BRANCH: lineage-24.0
  MAGISKBOOT_URL_CACHED: https://github.com/Dry-Earth/hummer-lineage-kernel-build/releases/download/test-assets/libmagiskboot-x86_64.so
  MAGISK_APK_URL: https://github.com/topjohnwu/Magisk/releases/download/v31.1/Magisk-v31.1.apk
  DDK_IMAGE: ghcr.io/ylarod/ddk-min:android15-6.6-20260313

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Free disk space
        run: |
          set -eux
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/share/swift
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h

      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Install host tools (pahole / build deps)
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            dwarves bc bison flex libncurses-dev libssl-dev libelf-dev \
            patch unzip zip python3 curl ca-certificates

      - name: Download and parse build-manifest.xml
        run: |
          set -eux
          urls="${{ inputs.manifest_url }}"
          case "${{ inputs.manifest_url }}" in
            https://mirrorbits.lineageos.org/*)
              urls="$urls $(printf '%s' "${{ inputs.manifest_url }}" | sed 's#https://mirrorbits.lineageos.org/#https://mirrors.ustc.edu.cn/lineageos/#')"
              ;;
          esac
          ok=0
          for u in $urls; do
            echo "==> try manifest $u"
            if curl -fL --retry 3 --retry-all-errors --connect-timeout 20 \
                 -A "Mozilla/5.0" -o manifest.xml "$u"; then
              ok=1
              break
            fi
          done
          test "$ok" = "1"
          test -s manifest.xml
          python3 ci/parse-manifest.py manifest.xml | tee metadata.env
          . ./metadata.env
          cat metadata.env >> "$GITHUB_ENV"
          test -n "$KERNEL_SHA"
          test -n "$MODULES_SHA"

      - name: Download OTA boot.img and magiskboot
        run: |
          set -eux
          mkdir -p bootwork
          urls="${{ inputs.boot_img_url }}"
          case "${{ inputs.boot_img_url }}" in
            https://mirrorbits.lineageos.org/*)
              urls="$urls $(printf '%s' "${{ inputs.boot_img_url }}" | sed 's#https://mirrorbits.lineageos.org/#https://mirrors.ustc.edu.cn/lineageos/#')"
              ;;
          esac
          ok=0
          for u in $urls; do
            echo "==> try boot.img $u"
            if curl -fL --retry 3 --retry-all-errors --connect-timeout 20 \
                 -A "Mozilla/5.0" -o bootwork/stock-boot.img "$u"; then
              size=$(stat -c %s bootwork/stock-boot.img)
              echo "downloaded $size bytes"
              if [ "$size" -gt 50000000 ]; then ok=1; break; fi
            fi
          done
          test "$ok" = "1"
          sha256sum bootwork/stock-boot.img | tee bootwork/boot.sha256

          if curl -fL --retry 3 --retry-all-errors -o bootwork/magiskboot "$MAGISKBOOT_URL_CACHED"; then
            chmod +x bootwork/magiskboot
          else
            curl -fL --retry 3 --retry-all-errors -o Magisk.apk "$MAGISK_APK_URL"
            unzip -o Magisk.apk lib/x86_64/libmagiskboot.so -d magisk
            install -m 755 magisk/lib/x86_64/libmagiskboot.so bootwork/magiskboot
          fi
          chmod +x bootwork/magiskboot

      - name: Clone kernel and modules at manifest revisions
        run: |
          set -eux
          for spec in "kernel:${KERNEL_REPO}:${KERNEL_SHA}:${KERNEL_BRANCH}" \
                      "sm8750-modules:${MODULES_REPO}:${MODULES_SHA}:${MODULES_BRANCH}"; do
            dir=${spec%%:*}; rest=${spec#*:}
            repo=${rest%%:*}; rest=${rest#*:}
            sha=${rest%%:*}; branch=${rest##*:}
            mkdir -p "$dir"
            cd "$dir"
            git init -q
            git remote add origin "https://github.com/${repo}.git"
            if ! git fetch --depth 1 --no-tags origin "$sha"; then
              echo "::warning::fetch by SHA failed, falling back to branch $branch"
              git fetch --no-tags --depth 200 origin "$branch" || git fetch --no-tags --depth 200 origin
            fi
            git checkout -q "$sha" 2>/dev/null || git checkout -q FETCH_HEAD
            test "$(git rev-parse HEAD)" = "$sha"
            cd ..
          done
          ln -sfn kernel sm8750

      - name: Extract config / release / clang from boot.img
        run: |
          set -eux
          mkdir -p build-config
          cd bootwork
          ./magiskboot unpack stock-boot.img
          ls -lh kernel
          sh ../kernel/scripts/extract-ikconfig kernel > ../build-config/stock.config
          test "$(grep -c '^CONFIG_' ../build-config/stock.config)" -gt 1000

          rel=$(strings kernel | grep -m1 'Linux version ' | sed -n 's/.*Linux version \([^ ]*\).*/\1/p')
          clang_raw=$(strings kernel | grep -m1 'based on r[0-9]' | sed -n 's/.*based on \(r[0-9]*\).*/\1/p')
          test -n "$rel"
          test -n "$clang_raw"
          mm=$(printf '%s' "$rel" | sed -n 's/^\([0-9][0-9]*\.[0-9][0-9]*\).*/\1/p')
          [ "$mm" = "6.6" ] || {
            echo "::error::this workflow currently supports the 6.6 hummer kernel, got $rel"
            exit 1
          }
          {
            echo "EXPECTED_RELEASE=$rel"
            echo "EXPECTED_CLANG=$clang_raw"
            echo "CLANG_REV=clang-$clang_raw"
            echo "CLANG_SHA=${CLANG_PROJECT_SHA:-}"
            echo "KMI=android15-6.6"
            echo "CONFIG_PATH=build-config/stock.config"
          } >> "$GITHUB_ENV"
          echo "release=$rel clang=$clang_raw"

      - name: Restore stock clang cache
        id: clang-cache
        uses: actions/cache@v4
        with:
          path: clang-stock
          key: hummer-auto-clang-${{ hashFiles('metadata.env') }}

      - name: Download matching stock clang
        run: |
          set -eux
          mkdir -p clang-stock
          if [ -x clang-stock/bin/clang ] &&
             clang-stock/bin/clang --version | grep -q "$EXPECTED_CLANG"; then
            echo "==> clang cache hit"
            exit 0
          fi
          rm -rf clang-stock
          mkdir -p clang-stock
          base="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive"
          urls="
            ${CLANG_SHA:+${base}/${CLANG_SHA}/${CLANG_REV}.tar.gz}
            ${base}/refs/heads/android17-release/${CLANG_REV}.tar.gz
            ${base}/refs/heads/android17-qpr1-release/${CLANG_REV}.tar.gz
            ${base}/refs/heads/android17-qpr2-release/${CLANG_REV}.tar.gz
            ${base}/refs/heads/android16-release/${CLANG_REV}.tar.gz
            ${base}/refs/heads/android16-qpr1-release/${CLANG_REV}.tar.gz
            ${base}/refs/heads/android16-qpr2-release/${CLANG_REV}.tar.gz
          "
          ok=0
          for attempt in 1 2 3; do
            for u in $urls; do
              echo "==> try $u (attempt $attempt)"
              rm -rf clang-stock /tmp/clang.tar.gz
              mkdir -p clang-stock
              if curl -fL --retry 5 --retry-all-errors --retry-delay 2 \
                   --connect-timeout 20 -o /tmp/clang.tar.gz "$u" &&
                 tar -xzf /tmp/clang.tar.gz -C clang-stock; then
                ok=1
                break 2
              fi
              echo "==> archive incomplete, retrying"
            done
          done
          test "$ok" = "1"
          test -x clang-stock/bin/clang
          clang-stock/bin/clang --version | grep -q "$EXPECTED_CLANG"

      - name: Save stock clang cache
        if: ${{ steps.clang-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: clang-stock
          key: hummer-auto-clang-${{ hashFiles('metadata.env') }}

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: hummer-auto-ccache-${{ hashFiles('metadata.env', 'build-config/stock.config') }}-${{ env.CLANG_REV }}
          restore-keys: |
            hummer-auto-ccache-

      - name: Apply SYSVIPC kABI patch
        run: |
          set -eux
          cd kernel
          patchfile=../patches/0001-sysvipc-kabi.patch
          if patch -p1 --dry-run --forward < "$patchfile" >/dev/null 2>&1; then
            patch -p1 --forward < "$patchfile"
          elif grep -q 'ANDROID_KABI_USE(6, struct sysv_sem sysvsem)' include/linux/sched.h; then
            echo "==> SYSVIPC kABI patch already applied"
          else
            echo "::error::SYSVIPC kABI patch does not apply to this kernel"
            exit 1
          fi
          grep -n 'ANDROID_KABI_USE(6, struct sysv_sem sysvsem)' include/linux/sched.h

      - name: Prepare optional container options
        run: |
          set -eux
          extra=""
          required="SYSVIPC POSIX_MQUEUE IPC_NS PID_NS DEVTMPFS NETFILTER_XT_MATCH_ADDRTYPE"
          forbidden="NF_TABLES NET_L3_MASTER_DEV CGROUP_PIDS CFS_BANDWIDTH"
          if [ "${{ inputs.extra_container_options }}" = "true" ]; then
            extra="$extra CGROUP_DEVICE TMPFS_POSIX_ACL TMPFS_XATTR"
            extra="$extra NETFILTER_XT_TARGET_REJECT NETFILTER_XT_TARGET_LOG NETFILTER_XT_MATCH_RECENT"
            extra="$extra IP_SET IP_SET_HASH_IP IP_SET_HASH_NET NETFILTER_XT_SET"
          fi
          if [ "${{ inputs.enable_bridge_netfilter }}" = "true" ]; then extra="$extra BRIDGE_NETFILTER"; fi
          if [ "${{ inputs.enable_macvlan }}" = "true" ]; then extra="$extra MACVLAN"; fi
          if [ "${{ inputs.enable_ipv6_nat }}" = "true" ]; then extra="$extra IP6_NF_NAT IP6_NF_TARGET_MASQUERADE"; fi
          if [ "${{ inputs.enable_user_ns }}" = "true" ]; then
            required="$required USER_NS"
          else
            forbidden="USER_NS $forbidden"
          fi
          extra=$(printf '%s' "$extra" | xargs)
          echo "REQUIRED_OPTS=$required" >> "$GITHUB_ENV"
          echo "EXTRA_OPTS=$extra" >> "$GITHUB_ENV"
          echo "FORBIDDEN_OPTS=$forbidden" >> "$GITHUB_ENV"
          echo "required options: $required"
          echo "extra options: $extra"
          echo "forbidden options: $forbidden"

      - name: Pull DDK toolchain
        run: docker pull "$DDK_IMAGE"

      - name: Build stock baseline vmlinux (for kABI diff)
        if: ${{ inputs.verify_kabi }}
        run: |
          set -eux
          mkdir -p .ccache
          docker run --rm \
            -v "$PWD:/work" \
            -v "$PWD/.ccache:/ccache" \
            -w /work \
            -e KERNELRELEASE="$EXPECTED_RELEASE" \
            -e EXPECTED_CLANG \
            -e CONFIG_IN=/work/build-config/stock.config \
            -e OUT=/work/kernel/out-stock \
            -e MODE=stock \
            -e TARGETS=vmlinux \
            -e CCACHE_DIR=/ccache \
            -e CCACHE_BASEDIR=/work/kernel \
            -e CCACHE_COMPRESS=1 \
            -e CCACHE_MAXSIZE=5G \
            "$DDK_IMAGE" \
            bash /work/ci/build-image-auto.sh

      - name: Build container-enabled Image
        run: |
          set -eux
          docker run --rm \
            -v "$PWD:/work" \
            -v "$PWD/.ccache:/ccache" \
            -w /work \
            -e KERNELRELEASE="$EXPECTED_RELEASE" \
            -e EXPECTED_CLANG \
            -e CONFIG_IN=/work/build-config/stock.config \
            -e OUT=/work/kernel/out \
            -e MODE=new \
            -e TARGETS=Image \
            -e REQUIRED_OPTS \
            -e EXTRA_OPTS \
            -e FORBIDDEN_OPTS \
            -e CCACHE_DIR=/ccache \
            -e CCACHE_BASEDIR=/work/kernel \
            -e CCACHE_COMPRESS=1 \
            -e CCACHE_MAXSIZE=5G \
            "$DDK_IMAGE" \
            bash /work/ci/build-image-auto.sh

      - name: Compare kABI struct layouts
        if: ${{ inputs.verify_kabi }}
        run: |
          set -eux
          mkdir -p build-config
          python3 ci/compare-kabi.py \
            --stock kernel/out-stock/vmlinux \
            --new kernel/out/vmlinux \
            --allow-new-fields sysvsem,sysvshm | tee build-config/kabi.txt

      - name: Report config changes
        run: |
          set -eux
          options="$REQUIRED_OPTS $EXTRA_OPTS"
          {
            for o in $options; do
              b=$(grep -E "^(# )?CONFIG_${o}(=| is not set)" kernel/out-stock/config.final 2>/dev/null | head -n1 || true)
              a=$(grep -E "^(# )?CONFIG_${o}(=| is not set)" kernel/out/config.final 2>/dev/null | head -n1 || true)
              [ -n "$b" ] || b="(absent)"
              [ -n "$a" ] || a="(absent)"
              printf '%s | %s | %s\n' "$o" "$b" "$a"
            done
          } | tee build-config/config.report.txt
          diff -u kernel/out-stock/config.final kernel/out/config.final > build-config/config.diff || true
          grep -cE '^[+-]#? ?CONFIG_' build-config/config.diff || true

      - name: Repack boot.img with the new Image
        working-directory: bootwork
        env:
          PATCHVBMETAFLAG: "1"
        run: |
          set -eux
          ./magiskboot unpack stock-boot.img
          cp ../kernel/out/arch/arm64/boot/Image kernel
          ./magiskboot repack stock-boot.img new-boot.img
          stock_size=$(stat -c %s stock-boot.img)
          new_size=$(stat -c %s new-boot.img)
          if [ "$new_size" -gt "$stock_size" ]; then
            echo "::error::new-boot.img ($new_size) is larger than the stock boot partition ($stock_size)"
            exit 1
          fi
          if [ "$new_size" -lt "$stock_size" ]; then
            truncate -s "$stock_size" new-boot.img
          fi
          sha256sum stock-boot.img new-boot.img
          ls -lh new-boot.img

      - name: Write build info
        run: |
          set -eux
          {
            echo "device:        OnePlus Ace 5 Pro (hummer)"
            echo "manifest:      ${{ inputs.manifest_url }}"
            echo "boot img:      ${{ inputs.boot_img_url }}"
            echo "boot sha256:   $(awk '{print $1}' bootwork/boot.sha256)"
            echo "kernel:        ${KERNEL_REPO} @ ${KERNEL_SHA}"
            echo "modules:       ${MODULES_REPO} @ ${MODULES_SHA}"
            echo "devicetrees:   ${DEVICETREES_SHA:-}"
            echo "clang project: ${CLANG_PROJECT_SHA:-}"
            echo "release:       ${EXPECTED_RELEASE}"
            echo "KMI:           ${KMI}"
            echo "config source: stock_boot"
            echo "clang:         $(clang-stock/bin/clang --version | head -n1)"
            echo "extra options: ${EXTRA_OPTS:-none}"
            echo "user ns:       ${{ inputs.enable_user_ns }}"
            echo "verify kABI:   ${{ inputs.verify_kabi }}"
            echo
            echo "config report (option | stock | final):"
            cat build-config/config.report.txt
            echo
            if [ -f build-config/kabi.txt ]; then
              echo "kABI check:"
              cat build-config/kabi.txt
              echo
            fi
            echo "image sha256:"
            sha256sum kernel/out/arch/arm64/boot/Image
            echo
            echo "boot sha256:"
            sha256sum bootwork/new-boot.img
          } > build-info.txt
          cat build-info.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hummer-boot-auto-${{ github.run_id }}
          if-no-files-found: error
          path: |
            bootwork/new-boot.img
            bootwork/stock-boot.img
            kernel/out/arch/arm64/boot/Image
            kernel/out/config.final
            kernel/out/System.map.final
            kernel/out-stock/vmlinux
            build-config/stock.config
            build-config/config.report.txt
            build-config/config.diff
            build-config/kabi.txt
            metadata.env
            build-info.txt

      - name: Publish release
        if: ${{ inputs.publish_release }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eux
          tag="boot-auto-${GITHUB_RUN_ID}"
          if gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" bootwork/new-boot.img bootwork/stock-boot.img \
              build-info.txt build-config/config.report.txt build-config/config.diff \
              build-config/kabi.txt -R "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" bootwork/new-boot.img bootwork/stock-boot.img \
              build-info.txt build-config/config.report.txt build-config/config.diff \
              build-config/kabi.txt \
              -R "$GITHUB_REPOSITORY" \
              --title "hummer boot auto (${EXPECTED_RELEASE}) ${GITHUB_RUN_ID}" \
              --notes-file build-info.txt
          fi
          gh release view "$tag" -R "$GITHUB_REPOSITORY" --json url -q .url
